<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Control · Continuous Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#1c1d21;--canvas:#f2efe7;--paper:#fff;--muted:#777871;--line:#dedbd3;--acid:#b9ff42;--pink:#ff4f9a;--pct:57%;--fill-left:50%;--fill-width:7%;--ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Space Mono","SF Mono",monospace;--ease:cubic-bezier(.22,1,.32,1);--snap:cubic-bezier(.34,1.56,.64,1)}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:72px 24px;background:var(--canvas);color:var(--ink);font-family:var(--ui)}
    html.is-preview body{min-height:100vh;min-height:100svh;padding:32px 24px}
    button,input{font:inherit}
    .panel{width:min(100%,440px);padding:16px;border:1px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:5px 5px 0 var(--ink)}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .title,.status,.label,.scale{font-family:var(--mono);font-weight:700;text-transform:uppercase}
    .title{font-size:10px;letter-spacing:.11em}
    .status{padding:5px 7px 4px;border:1px solid var(--ink);border-radius:3px;background:var(--acid);font-size:9px;letter-spacing:.08em}
    .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border:1px solid var(--line);border-radius:6px;background:#efede7}
    .mode{min-height:38px;border:0;border-radius:3px;background:transparent;color:#74756f;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.025em;text-transform:uppercase;cursor:pointer;transition:background 160ms ease,color 160ms ease,transform 160ms var(--ease)}
    .mode:hover{color:var(--ink)}
    .mode:active{transform:scale(.97)}
    .mode[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--ink),2px 2px 0 var(--ink)}
    .mode:focus-visible,.range:focus-visible,.reset:focus-visible{outline:3px solid rgba(85,104,255,.65);outline-offset:3px}
    .value-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:19px 0 9px}
    .label{color:#6a6b65;font-size:9px;letter-spacing:.1em}
    .value{font:700 25px/1 var(--mono);letter-spacing:-.05em}
    .slider-wrap{position:relative;height:58px}
    .track{position:absolute;left:0;right:0;top:25px;height:8px;border:1px solid var(--ink);border-radius:3px;background:#e4e1da;overflow:hidden}
    .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(28,29,33,.09) 23px 24px);pointer-events:none}
    .fill{position:absolute;z-index:1;top:25px;left:var(--fill-left);width:var(--fill-width);height:8px;background:var(--pink);pointer-events:none;transition:left 70ms linear,width 70ms linear}
    .center{position:absolute;z-index:2;left:50%;top:20px;width:1px;height:18px;background:var(--ink);transform:translateX(-50%);pointer-events:none}
    .handle{position:absolute;z-index:3;left:var(--pct);top:17px;width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;background:#fff;box-shadow:2px 2px 0 var(--ink);transform:translateX(-50%);pointer-events:none;transition:left 70ms linear,transform 170ms var(--snap),background 150ms ease}
    .handle::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ink)}
    .range{position:absolute;z-index:4;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}
    .range:active{cursor:grabbing}
    .slider-wrap:hover .handle{transform:translateX(-50%) scale(1.12)}
    .slider-wrap.pressed .handle{background:var(--acid);transform:translateX(-50%) scale(.92)}
    .slider-wrap.dragging .handle{animation:pulse 440ms steps(2) infinite}
    .slider-wrap.settling .handle{animation:snap 320ms var(--snap)}
    .scale{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:-2px;color:#85867f;font-size:8px;letter-spacing:.04em}
    .scale span:nth-child(2){text-align:center}.scale span:last-child{text-align:right}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
    .readout{font:600 9px/1 var(--mono);color:#777871;letter-spacing:.04em;text-transform:uppercase}
    .reset{min-width:72px;min-height:38px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform 150ms var(--ease),box-shadow 150ms var(--ease)}
    .reset:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
    .reset:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
    .panel.updating .value{animation:value-refresh 240ms var(--ease)}
    .panel.mode-changing{animation:panel-refresh 280ms var(--ease)}
    @keyframes pulse{50%{background:var(--pink);transform:translateX(-50%) scale(1.15)}}
    @keyframes snap{50%{transform:translateX(-50%) scaleX(1.32) scaleY(.85)}}
    @keyframes value-refresh{50%{opacity:.45;transform:translateY(-2px)}}
    @keyframes panel-refresh{50%{box-shadow:7px 7px 0 var(--ink)}}
    @media(max-width:500px){body{padding:68px 16px 28px}.panel{padding:14px}.mode{font-size:8px}.value{font-size:23px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    design-specs{position:fixed}
  </style>
</head>
<body>
  <main class="panel" id="panel" aria-label="Continuous light adjustment slider">
    <div class="head"><span class="title">Light Control</span><span class="status" id="status">Exposure</span></div>
    <div class="modes" role="tablist" aria-label="Light parameter">
      <button class="mode" id="exposureTab" type="button" role="tab" aria-selected="true">Exposure</button>
      <button class="mode" id="shadowsTab" type="button" role="tab" aria-selected="false">Shadows</button>
      <button class="mode" id="highlightsTab" type="button" role="tab" aria-selected="false">Highlights</button>
    </div>
    <div class="value-row"><span class="label" id="label">Exposure</span><output class="value" id="value" for="level">+0.7 EV</output></div>
    <div class="slider-wrap" id="sliderWrap">
      <span class="track" aria-hidden="true"></span><span class="fill" aria-hidden="true"></span><span class="center" aria-hidden="true"></span><span class="handle" aria-hidden="true"></span>
      <input class="range" id="level" type="range" min="-5" max="5" step="0.1" value="0.7" aria-label="Exposure" aria-valuetext="Exposure plus 0.7 EV">
    </div>
    <div class="scale" aria-hidden="true"><span id="minLabel">−5 EV</span><span>0</span><span id="maxLabel">+5 EV</span></div>
    <div class="footer"><span class="readout" id="readout">Fine adjustment · 0.1 EV</span><button class="reset" id="reset" type="button">Reset</button></div>
  </main>
  <script>
    const configs={exposure:{label:'Exposure',min:-5,max:5,step:.1,value:.7,unit:' EV',fine:'Fine adjustment · 0.1 EV'},shadows:{label:'Shadows',min:-100,max:100,step:1,value:18,unit:'%',fine:'Fine adjustment · 1%'},highlights:{label:'Highlights',min:-100,max:100,step:1,value:-24,unit:'%',fine:'Fine adjustment · 1%'}};
    const root=document.documentElement,panel=document.getElementById('panel'),wrap=document.getElementById('sliderWrap'),input=document.getElementById('level'),value=document.getElementById('value'),label=document.getElementById('label'),status=document.getElementById('status'),minLabel=document.getElementById('minLabel'),maxLabel=document.getElementById('maxLabel'),readout=document.getElementById('readout'),reset=document.getElementById('reset'),tabs={exposure:document.getElementById('exposureTab'),shadows:document.getElementById('shadowsTab'),highlights:document.getElementById('highlightsTab')};
    let mode='exposure',settleTimer,motionTimer,modeTimer;
    function signed(number,unit){const precision=unit===' EV'?1:0;const rounded=Number(number).toFixed(precision);return`${number>0?'+':number<0?'−':''}${Math.abs(Number(rounded)).toFixed(precision)}${unit}`}
    function render(animate=false){const config=configs[mode],number=Number(input.value),pct=(number-config.min)/(config.max-config.min)*100,left=Math.min(50,pct),width=Math.abs(pct-50);config.value=number;root.style.setProperty('--pct',`${pct}%`);root.style.setProperty('--fill-left',`${left}%`);root.style.setProperty('--fill-width',`${width}%`);value.textContent=signed(number,config.unit);input.setAttribute('aria-valuetext',`${config.label} ${signed(number,config.unit)}`);if(animate){panel.classList.remove('updating');requestAnimationFrame(()=>panel.classList.add('updating'));clearTimeout(motionTimer);motionTimer=setTimeout(()=>panel.classList.remove('updating'),260)}}
    function selectMode(next){mode=next;const config=configs[mode];input.min=config.min;input.max=config.max;input.step=config.step;input.value=config.value;input.setAttribute('aria-label',config.label);label.textContent=config.label;status.textContent=config.label;minLabel.textContent=signed(config.min,config.unit);maxLabel.textContent=signed(config.max,config.unit);readout.textContent=config.fine;Object.entries(tabs).forEach(([name,tab])=>tab.setAttribute('aria-selected',String(name===mode)));panel.classList.remove('mode-changing');requestAnimationFrame(()=>panel.classList.add('mode-changing'));clearTimeout(modeTimer);modeTimer=setTimeout(()=>panel.classList.remove('mode-changing'),300);render()}
    function settle(){wrap.classList.remove('pressed','dragging','settling');requestAnimationFrame(()=>wrap.classList.add('settling'));clearTimeout(settleTimer);settleTimer=setTimeout(()=>wrap.classList.remove('settling'),340)}
    Object.entries(tabs).forEach(([name,tab])=>tab.addEventListener('click',()=>selectMode(name)));input.addEventListener('input',()=>render(true));input.addEventListener('pointerdown',event=>{wrap.classList.add('pressed','dragging');input.setPointerCapture?.(event.pointerId)});input.addEventListener('pointerup',settle);input.addEventListener('pointercancel',settle);input.addEventListener('change',settle);input.addEventListener('keydown',()=>wrap.classList.add('pressed'));input.addEventListener('keyup',settle);reset.addEventListener('click',()=>{input.value=0;render(true)});selectMode('exposure');
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
