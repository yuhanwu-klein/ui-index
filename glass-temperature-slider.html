<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Temperature · Continuous Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#f7f8fa;--muted:rgba(238,242,247,.54);--cyan:#63e6ff;--warm:#ff6b45;--pct:53.57%;--lift:0px;--flux-top:60px;--flux-height:0px;--ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Space Mono","SF Mono",monospace;--spring:cubic-bezier(.2,1.45,.45,1)}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:72px 24px;background:#fff;color:var(--ink);font-family:var(--ui);overflow:hidden}
    html.is-preview body{min-height:100vh;min-height:100svh;padding:32px 24px}
    button,input{font:inherit}
    .panel{position:relative;width:min(100%,640px);padding:28px 30px 26px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:linear-gradient(145deg,rgba(48,54,64,.97),rgba(18,22,28,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.035),0 24px 64px rgba(14,20,28,.2);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);overflow:hidden}
    .panel::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 18% 0,rgba(255,255,255,.13),transparent 30%),linear-gradient(105deg,transparent 58%,rgba(255,255,255,.035) 59%,transparent 66%);pointer-events:none}
    .head{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
    .title-line{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .label{display:block;color:rgba(244,247,250,.76);font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
    .status{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border:1px solid rgba(189,235,241,.18);border-radius:999px;background:rgba(178,232,239,.08);color:rgba(222,250,252,.76);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:color 180ms ease,background 180ms ease,border-color 180ms ease}
    .status[data-zone="cool"]{color:#a8efff;background:rgba(99,230,255,.1);border-color:rgba(99,230,255,.2)}
    .status[data-zone="warm"]{color:#ffc1ad;background:rgba(255,107,69,.1);border-color:rgba(255,107,69,.2)}
    .value{font:400 38px/1 var(--mono);letter-spacing:-.065em;text-shadow:0 0 24px rgba(255,255,255,.12)}
    .unit{margin-left:3px;color:rgba(247,248,250,.58);font-size:.48em;letter-spacing:0}
    .slider-stage{position:relative;height:126px;--magnet-opacity:0;border-radius:14px}
    .slider-stage::after{content:"";position:absolute;z-index:7;inset:38px 4px 35px;border:2px solid transparent;border-radius:12px;pointer-events:none;transition:border-color 140ms ease,box-shadow 140ms ease}
    .slider-stage:has(.range:focus-visible)::after{border-color:rgba(133,224,255,.78);box-shadow:0 0 0 4px rgba(99,230,255,.1)}
    .rail-shadow,.rail{position:absolute;left:18px;right:18px;top:59px;height:6px;border-radius:999px}
    .rail-shadow{background:#06080b;box-shadow:0 1px 0 rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.35)}
    .rail{z-index:1;background:linear-gradient(90deg,var(--cyan),#c7f7ff 35%,#f6f7f8 50%,#ffd1bd 67%,var(--warm));box-shadow:0 0 14px rgba(99,230,255,.19),0 0 14px rgba(255,107,69,.14);opacity:.88}
    .elastic{position:absolute;z-index:2;inset:0;width:100%;height:100%;overflow:visible;opacity:0;pointer-events:none;filter:drop-shadow(0 0 8px rgba(158,234,255,.4));transition:opacity 120ms ease}
    .elastic path{fill:none;stroke:url(#temperatureGradient);stroke-width:6;stroke-linecap:round}
    .slider-stage.dragging .elastic,.slider-stage.settling .elastic{opacity:1}
    .slider-stage.dragging .rail,.slider-stage.settling .rail{opacity:.38}
    .center{position:absolute;z-index:2;left:50%;top:51px;width:1px;height:21px;background:rgba(255,255,255,.62);box-shadow:0 0 8px rgba(255,255,255,.38);pointer-events:none}
    .flux{position:absolute;z-index:2;left:var(--pct);top:var(--flux-top);width:54px;height:max(2px,var(--flux-height));border-radius:50%;background:linear-gradient(180deg,rgba(211,250,255,.05),rgba(164,241,255,.58),rgba(255,255,255,.08));filter:blur(5px);opacity:var(--magnet-opacity);transform:translateX(-50%);transform-origin:center bottom;pointer-events:none;transition:opacity 120ms ease,height 70ms linear,top 70ms linear}
    .thumb{position:absolute;z-index:4;left:var(--pct);top:62px;width:46px;height:46px;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.6),rgba(255,255,255,.12) 15%,rgba(151,171,191,.12) 42%,rgba(7,10,14,.72) 68%),linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.035));box-shadow:inset 0 2px 4px rgba(255,255,255,.23),inset 0 -8px 14px rgba(0,0,0,.36),0 10px 22px rgba(0,0,0,.4),0 0 0 6px rgba(255,255,255,.025);transform:translate(-50%,calc(-50% + var(--lift)));pointer-events:none;transition:left 45ms linear,transform 220ms cubic-bezier(.2,.8,.2,1),box-shadow 180ms ease,filter 180ms ease}
    .thumb::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.75) 0 2px,rgba(255,255,255,.12) 3px 28%,rgba(0,0,0,.22) 62%);box-shadow:inset 0 1px 3px rgba(255,255,255,.25)}
    .thumb::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#f8fbff;box-shadow:0 0 10px rgba(255,255,255,.85);transform:translate(-50%,-50%)}
    .range{position:absolute;z-index:5;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}
    .range:active{cursor:grabbing}
    .slider-stage:hover:not(.dragging) .thumb{filter:brightness(1.12);box-shadow:inset 0 2px 4px rgba(255,255,255,.3),inset 0 -8px 14px rgba(0,0,0,.36),0 14px 28px rgba(0,0,0,.48),0 0 20px rgba(170,234,255,.18),0 0 0 8px rgba(255,255,255,.035)}
    .slider-stage.pressed .thumb{filter:brightness(1.22);transform:translate(-50%,calc(-50% + var(--lift))) scale(.94)}
    .slider-stage.dragging .thumb{transition:left 45ms linear,transform 70ms linear,box-shadow 140ms ease;box-shadow:inset 0 2px 4px rgba(255,255,255,.32),inset 0 -8px 14px rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.46),0 0 20px rgba(128,224,255,.18)}
    .slider-stage.magnetized .thumb{box-shadow:inset 0 2px 5px rgba(255,255,255,.36),inset 0 -8px 14px rgba(0,0,0,.38),0 12px 25px rgba(0,0,0,.48),0 0 25px rgba(201,247,255,.34),0 0 0 8px rgba(194,244,255,.045)}
    .slider-stage.settling .thumb{animation:snap 220ms cubic-bezier(.2,.8,.2,1)}
    .ticks{position:absolute;left:18px;right:18px;top:78px;height:26px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .tick{width:1px;height:5px;background:rgba(255,255,255,.3)}
    .tick.major{height:10px;background:rgba(255,255,255,.56)}
    .legend{position:absolute;left:18px;right:18px;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;color:rgba(238,242,247,.62);font:500 11px/1 var(--ui);letter-spacing:.055em;text-transform:uppercase}
    .legend span:nth-child(2){text-align:center}.legend span:last-child{text-align:right}
    .range:focus-visible{opacity:0;outline:0}
    @keyframes snap{0%{transform:translate(-50%,calc(-50% + var(--lift))) scale(.97)}65%{transform:translate(-50%,-50%) scaleX(1.04) scaleY(.97)}100%{transform:translate(-50%,-50%) scale(1)}}
    @media(max-width:680px){body{padding:66px 16px 28px}.panel{padding:22px 18px 20px}.value{font-size:32px}.slider-stage{height:118px}.rail-shadow,.rail{left:8px;right:8px}.ticks,.legend{left:8px;right:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    design-specs{position:fixed}
  </style>
</head>
<body>
  <main class="panel" aria-label="Continuous temperature control">
    <div class="head"><div class="title-line"><span class="label">Temperature</span><span class="status" id="status" data-zone="comfort">Comfort</span></div><output class="value" id="value" for="temperature">23.5<span class="unit">°C</span></output></div>
    <div class="slider-stage" id="stage">
      <span class="rail-shadow" aria-hidden="true"></span><span class="rail" aria-hidden="true"></span>
      <svg class="elastic" aria-hidden="true" preserveAspectRatio="none"><defs><linearGradient id="temperatureGradient"><stop offset="0" stop-color="#63e6ff"/><stop offset=".5" stop-color="#f6f7f8"/><stop offset="1" stop-color="#ff6b45"/></linearGradient></defs><path id="elasticPath"/></svg>
      <span class="center" aria-hidden="true"></span><span class="flux" aria-hidden="true"></span><span class="thumb" aria-hidden="true"></span>
      <input class="range" id="temperature" type="range" min="16" max="30" step="0.5" value="23.5" aria-label="Temperature" aria-valuetext="23.5 degrees Celsius, comfort">
      <div class="ticks" aria-hidden="true"></div>
      <div class="legend" aria-hidden="true"><span>Cool · 16°</span><span>Comfort · 23°</span><span>Warm · 30°</span></div>
    </div>
  </main>
  <script>
    const root=document.documentElement,stage=document.getElementById('stage'),input=document.getElementById('temperature'),output=document.getElementById('value'),status=document.getElementById('status'),ticks=document.querySelector('.ticks'),elasticPath=document.getElementById('elasticPath');let lastLift=0;
    for(let index=0;index<29;index++){const tick=document.createElement('span');tick.className='tick'+(index%7===0?' major':'');ticks.append(tick)}
    function updateElastic(lift=lastLift){const width=stage.clientWidth,pct=(Number(input.value)-16)/14,x=18+pct*(width-36),y=62+lift,shoulder=Math.min(72,x-18,width-18-x);elasticPath.setAttribute('d',`M 18 62 L ${x-shoulder} 62 C ${x-shoulder*.55} 62 ${x-shoulder*.38} ${y} ${x} ${y} C ${x+shoulder*.38} ${y} ${x+shoulder*.55} 62 ${x+shoulder} 62 L ${width-18} 62`)}
    function zoneFor(number){return number<21?'cool':number>25?'warm':'comfort'}
    function render(){const number=Number(input.value),pct=(number-16)/14*100,zone=zoneFor(number);root.style.setProperty('--pct',`${pct}%`);output.innerHTML=`${number.toFixed(1)}<span class="unit">°C</span>`;status.textContent=zone;status.dataset.zone=zone;input.setAttribute('aria-valuetext',`${number.toFixed(1)} degrees Celsius, ${zone}`);updateElastic()}
    function magneticMove(event){const rect=stage.getBoundingClientRect(),railY=rect.top+62,distance=event.clientY-railY,near=Math.abs(distance)<=6,resisted=near?0:Math.sign(distance)*Math.min(8,2+(Math.abs(distance)-6)*.18),thumbCenter=62+resisted,fluxTop=Math.min(62,thumbCenter),fluxHeight=Math.max(2,Math.abs(resisted));lastLift=resisted;root.style.setProperty('--lift',`${resisted}px`);root.style.setProperty('--flux-top',`${fluxTop}px`);root.style.setProperty('--flux-height',`${fluxHeight}px`);root.style.setProperty('--magnet-opacity',String(Math.max(.12,.55-Math.abs(distance)/100)));stage.classList.toggle('magnetized',near);updateElastic(resisted)}
    function settle(){const startLift=lastLift,startTime=performance.now();root.style.setProperty('--lift','0px');root.style.setProperty('--flux-top','61px');root.style.setProperty('--flux-height','2px');root.style.setProperty('--magnet-opacity','.45');stage.classList.remove('pressed','dragging','settling');stage.classList.add('magnetized','settling');cancelAnimationFrame(stage._snapFrame);function frame(now){const t=Math.min(1,(now-startTime)/220),ease=1-Math.pow(1-t,3),offset=startLift*(1-ease);lastLift=offset;updateElastic(offset);if(t<1)stage._snapFrame=requestAnimationFrame(frame);else{lastLift=0;updateElastic(0)}}stage._snapFrame=requestAnimationFrame(frame);clearTimeout(stage._settleTimer);stage._settleTimer=setTimeout(()=>{stage.classList.remove('settling','magnetized');root.style.setProperty('--magnet-opacity','0')},240)}
    input.addEventListener('input',render);input.addEventListener('pointerdown',event=>{cancelAnimationFrame(stage._snapFrame);stage.classList.remove('settling');stage.classList.add('pressed','dragging');magneticMove(event);input.setPointerCapture?.(event.pointerId)});input.addEventListener('pointermove',event=>{if(stage.classList.contains('dragging'))magneticMove(event)});input.addEventListener('pointerup',settle);input.addEventListener('pointercancel',settle);input.addEventListener('change',()=>{if(!stage.classList.contains('dragging'))settle()});input.addEventListener('keydown',()=>stage.classList.add('pressed','magnetized'));input.addEventListener('keyup',settle);render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
