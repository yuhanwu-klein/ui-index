<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engage check</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    :root{--ease:cubic-bezier(.4,0,.2,1);}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;}
    body{display:grid;place-items:center;}

    .row{display:flex;gap:28px;align-items:center;padding:40px;}

    /* flat check — square with rounded corners */
    .check{position:relative;width:84px;height:84px;border:0;padding:0;cursor:pointer;outline:0;background:transparent;isolation:isolate;}
    .box-clip{position:absolute;inset:0;border-radius:22px;overflow:hidden;}
    .box{position:absolute;inset:0;background:#e4e4e8;transition:background 650ms var(--ease);}
    .check[aria-checked="true"] .box{
      background:radial-gradient(ellipse at 50% 60%, #1e7cff 0%, #0f3680 55%, #061534 100%);
    }
    /* rays INSIDE the box, clipped */
    .rays{position:absolute;top:50%;left:50%;width:260px;height:260px;transform:translate(-50%,-50%);
      pointer-events:none;opacity:0;transition:opacity .55s var(--ease);}
    .check[aria-checked="true"] .rays{opacity:1;}
    .rays svg{width:100%;height:100%;display:block;animation:spin 40s linear infinite;}
    .rays path{fill:url(#rayg);mix-blend-mode:screen;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* checkmark — thin white, draws in */
    .tick{position:absolute;inset:0;z-index:3;display:grid;place-items:center;opacity:0;transition:opacity .25s var(--ease) .15s;}
    .tick svg{width:40px;height:40px;}
    .tick path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset .4s var(--ease) .18s;}
    .check[aria-checked="true"] .tick{opacity:1;}
    .check[aria-checked="true"] .tick path{stroke-dashoffset:0;}
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <linearGradient id="rayg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4ad8ff" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#4ad8ff" stop-opacity=".1"/>
        <stop offset="1" stop-color="#4ad8ff" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="row" id="row"></div>

  <script>
    const count = 3;
    const row = document.getElementById('row');
    row.innerHTML = Array.from({length:count}, (_, i) => `
      <button class="check" type="button" role="checkbox" aria-checked="${i===0?'true':'false'}" aria-label="Option ${i+1}">
        <span class="box-clip">
          <span class="box"></span>
          <span class="rays" aria-hidden="true"><svg viewBox="-50 -50 100 100"><g class="rg"></g></svg></span>
        </span>
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M10 24 L20 34 L38 14"/></svg></span>
      </button>`).join('');

    // populate rays SVG paths once per instance
    let paths = '';
    for (let i = 0; i < 36; i++) {
      const a = (i * 10) * Math.PI / 180;
      const r = 55;
      const x1 = Math.cos(a - 0.012) * 3, y1 = Math.sin(a - 0.012) * 3;
      const x2 = Math.cos(a + 0.012) * 3, y2 = Math.sin(a + 0.012) * 3;
      const x3 = Math.cos(a + 0.02) * r, y3 = Math.sin(a + 0.02) * r;
      const x4 = Math.cos(a - 0.02) * r, y4 = Math.sin(a - 0.02) * r;
      paths += `<path d="M${x1} ${y1} L${x2} ${y2} L${x3} ${y3} L${x4} ${y4} Z"/>`;
    }
    document.querySelectorAll('.rg').forEach(g => g.innerHTML = paths);

    row.addEventListener('click', (e) => {
      const el = e.target.closest('.check');
      if (!el) return;
      el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    });

    if (new URLSearchParams(location.search).has('preview')) {
      const checks = [...row.querySelectorAll('.check')];
      let i = 1;
      window.setInterval(() => { checks[i % checks.length].click(); i += 1; }, 1400);
    }
  </script>
</body>
</html>
