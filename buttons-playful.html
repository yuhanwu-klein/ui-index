<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons · Playful</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#e0e5ec;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .player{
      width:520px;max-width:92vw;
      border-radius:28px;padding:28px;
      background:#e0e5ec;
      border:1px solid rgba(255,255,255,.55);
      box-shadow:10px 10px 20px #b0b6bf,-10px -10px 20px #ffffff;
      display:flex;flex-direction:column;
    }

    /* --- Top --- */
    .top{display:flex;gap:16px;align-items:flex-start}
    .album{
      width:88px;height:88px;border-radius:18px;flex-shrink:0;
      background:#e0e5ec;
      box-shadow:inset 3px 3px 6px #b8bec7,inset -3px -3px 6px #ffffff;
      display:flex;align-items:center;justify-content:center;
    }
    .album svg.led{width:52px;height:52px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:6px}
    .track{font:700 15px/1.2 inherit;letter-spacing:-.02em;color:#3a4558}
    .artist{font:500 11px/1 inherit;color:#8a9bb0}
    .lyrics-line{
      font:italic 500 9px/1.4 inherit;color:#7a8a9e;letter-spacing:.01em;
      margin-top:4px;overflow:hidden;white-space:nowrap;
    }
    .lyrics-line span{display:inline-block;animation:scroll-lyric 8s linear infinite}
    @keyframes scroll-lyric{0%{transform:translateX(60%)}100%{transform:translateX(-100%)}}

    .mood-group{display:flex;flex-direction:column;gap:5px;flex-shrink:0;padding-top:2px}
    .mood{
      display:flex;align-items:center;gap:4px;
      border:none;border-radius:10px;cursor:pointer;
      font:600 8px/1 inherit;letter-spacing:.02em;
      padding:5px 10px;min-height:26px;
      background:#e0e5ec;color:#8a9bb0;
      box-shadow:2px 2px 5px #b8bec7,-2px -2px 5px #ffffff;
      transition:box-shadow .2s ease,color .2s ease;
    }
    .mood svg.led{width:10px;height:10px;flex-shrink:0}
    .mood:hover{box-shadow:3px 3px 7px #b8bec7,-3px -3px 7px #ffffff;color:#5a6a7e}
    .mood.active{box-shadow:inset 2px 2px 5px #b8bec7,inset -2px -2px 5px #ffffff;color:#4a5568}

    /* --- Progress --- */
    .progress-row{display:flex;align-items:center;gap:8px;margin-top:16px}
    .time{font:600 8px/1 "SF Mono",monospace;color:#8a9bb0;letter-spacing:.04em;flex-shrink:0}
    .track-bar{flex:1;height:5px;border-radius:3px;background:#d0d5dc;box-shadow:inset 1px 1px 2px #b8bec7,inset -1px -1px 2px #f0f4f8;position:relative;cursor:pointer}
    .fill{width:38%;height:100%;border-radius:3px;background:linear-gradient(90deg,#42a5f5,#66bb6a);position:relative;transition:width .1s ease;pointer-events:none}
    .fill::after{content:'';position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:#e0e5ec;box-shadow:2px 2px 4px #b8bec7,-2px -2px 4px #fff;transform:translateY(-50%)}

    /* --- Transport --- */
    .transport{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px}
    .actions{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}

    /* --- Base --- */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:5px;
      border:none;border-radius:14px;cursor:pointer;
      font-family:inherit;letter-spacing:.01em;
      background:#e0e5ec;color:#5a6a7e;
      position:relative;transition:box-shadow .2s ease,transform .12s ease,color .2s ease,opacity .2s ease;
    }
    .btn:focus-visible{outline:2px solid #7ea8e8;outline-offset:3px}
    .btn:active:not(:disabled){transform:scale(.95)}

    /* PRIMARY */
    .btn.primary{
      box-shadow:6px 6px 12px #b8bec7,-6px -6px 12px #ffffff;
      font-weight:700;font-size:13px;color:#4a5568;
      padding:12px 24px;min-height:48px;border-radius:16px;
    }
    .btn.primary svg.led{width:22px;height:22px}
    .btn.primary.icon-only{padding:12px;min-width:48px}
    .btn.primary:hover{box-shadow:8px 8px 16px #b8bec7,-8px -8px 16px #ffffff}
    .btn.primary:active:not(:disabled){box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #ffffff}

    /* SECONDARY */
    .btn.secondary{
      box-shadow:2px 2px 5px #b8bec7,-2px -2px 5px #ffffff;
      font-weight:500;font-size:9px;color:#7a8a9e;
      padding:5px 12px;min-height:28px;border-radius:10px;
    }
    .btn.secondary svg.led{width:12px;height:12px}
    .btn.secondary.icon-only{padding:5px;min-width:28px}
    .btn.secondary:hover{box-shadow:3px 3px 7px #b8bec7,-3px -3px 7px #ffffff}
    .btn.secondary:active:not(:disabled){box-shadow:inset 2px 2px 4px #b8bec7,inset -2px -2px 4px #ffffff}
    .btn.secondary.toggled{box-shadow:inset 2px 2px 4px #b8bec7,inset -2px -2px 4px #ffffff;color:#4a5568}

    /* TERTIARY */
    .btn.tertiary{
      box-shadow:inset 1px 1px 3px #b8bec7,inset -1px -1px 3px #ffffff;
      font-weight:500;font-size:8px;color:#8a9bb0;
      padding:4px 10px;min-height:24px;border-radius:8px;
    }
    .btn.tertiary svg.led{width:10px;height:10px}
    .btn.tertiary.icon-only{padding:4px;min-width:24px}
    .btn.tertiary:hover{box-shadow:inset 2px 2px 5px #b0b6bf,inset -2px -2px 5px #ffffff;color:#5a6a7e}
    .btn.tertiary:active:not(:disabled){box-shadow:inset 3px 3px 7px #aeb4bd,inset -3px -3px 7px #ffffff}
    .btn.tertiary.toggled{color:#42a5f5}

    .btn:disabled{opacity:.45;cursor:default;transform:none}
    .led circle{transition:fill .3s ease}
    html.is-preview .player{width:100%;max-width:520px}
  </style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="player">

  <div class="top">
    <div class="album" data-char="heart" data-led="#ec407a"></div>
    <div class="info">
      <div class="track">Pixel Dreams</div>
      <div class="artist">Chiptune Orchestra</div>
      <div class="lyrics-line" id="lyrics" style="display:none">
        <span>Dancing through the pixels tonight, every LED shining so bright, lost in chiptune paradise</span>
      </div>
    </div>
    <div class="mood-group">
      <button class="mood active" data-char="face_happy" data-led="#66bb6a">Happy</button>
      <button class="mood" data-char="face_meh" data-led="#ffa726">Chill</button>
      <button class="mood" data-char="face_mad" data-led="#ef5350">Intense</button>
    </div>
  </div>

  <div class="progress-row">
    <span class="time" id="cur">2:34</span>
    <div class="track-bar" id="bar">
      <div class="fill" id="fill"></div>
    </div>
    <span class="time" id="dur">4:12</span>
  </div>

  <!-- PRIMARY -->
  <div class="transport">
    <button class="btn primary icon-only" id="prev-btn" data-char="prev" data-led="#78909c" aria-label="Previous"></button>
    <button class="btn primary" id="play-btn" data-char="play" data-led="#42a5f5"><span id="play-label">Play</span></button>
    <button class="btn primary" id="next-btn" data-char="next" data-led="#78909c">Skip</button>
  </div>

  <!-- SECONDARY: icon+text · text-only · icon-only -->
  <div class="actions">
    <button class="btn secondary" id="like-btn" data-char="heart" data-led="#90a4ae">Like</button>
    <button class="btn secondary" id="shuffle-btn">Shuffle</button>
    <button class="btn secondary icon-only" id="vol-btn" data-char="speaker" data-led="#66bb6a" aria-label="Volume"></button>
  </div>

  <!-- TERTIARY: icon+text · text-only · icon-only -->
  <div class="actions">
    <button class="btn tertiary" id="repeat-btn" data-char="repeat" data-led="#42a5f5"><span id="repeat-label">Repeat</span></button>
    <button class="btn tertiary" id="lyrics-btn">Lyrics</button>
    <button class="btn tertiary icon-only" id="queue-btn" data-char="queue" data-led="#78909c" aria-label="Queue"></button>
  </div>

</div>

<script>
(function(){
  /* ── pixel data ── */
  var px={
    play:'.X......./.XX....../.XXX...../.XXXX..../.XXXXX.../.XXXX..../.XXX...../.XX....../.X.......',
    pause:'.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX.',
    prev:'X.....X./X....XX./X...XXX./X..XXXX./X.XXXXX./X..XXXX./X...XXX./X....XX./X.....X.',
    next:'.X.....X/.XX....X/.XXX...X/.XXXX..X/.XXXXX.X/.XXXX..X/.XXX...X/.XX....X/.X.....X',
    heart:'.XX...XX./XXXX.XXXX/XXXXXXXXX/XXXXXXXXX/.XXXXXXX./..XXXXX./...XXX./....X....',
    speaker:'..X....../..XX...../XXXXX.X../XXXXX.X.X/XXXXX.X../..XX...../..X......',
    repeat:'.XXXXX./.X...X./X..X..X/X.....X/X..X..X/.X...X./.XXXXX.',
    queue:'XXXXXXX/......./XXXXX../......./XXX....',
    face_happy:'..XXXXX../.X.....X./X..X.X..X/X.......X/X.X...X.X/X..XXX..X/.X.....X./..XXXXX..',
    face_meh:'..XXXXX../.X.....X./X..X.X..X/X.......X/X.......X/X.XXXXX.X/.X.....X./..XXXXX..',
    face_mad:'..XXXXX../.X.....X./X.X...X.X/X..X.X..X/X.......X/X..XXX..X/X.X...X.X/.X.....X./..XXXXX..'
  };

  var ns='http://www.w3.org/2000/svg';

  function buildSVG(el,charName){
    var data=px[charName];if(!data)return;
    var color=el.dataset.led||'#ffa726';
    var rows=data.split('/');
    var h=rows.length,w=Math.max.apply(null,rows.map(function(r){return r.length}));
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('class','led');
    var dim=document.createElementNS(ns,'g'),lit=document.createElementNS(ns,'g');
    lit.setAttribute('filter','url(#glow)');svg.appendChild(dim);svg.appendChild(lit);
    var dots=[];
    rows.forEach(function(row,y){for(var x=0;x<w;x++){
      var on=x<row.length&&row[x]==='X';
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',x+.5);c.setAttribute('cy',y+.5);c.setAttribute('r',on?.34:.18);
      if(on){c.setAttribute('fill',color);c._d=x+y;lit.appendChild(c);dots.push(c)}
      else{c.setAttribute('fill','rgba(120,130,145,0.13)');dim.appendChild(c)}
    }});
    el._dots=dots;el._color=color;
    el._maxD=Math.max.apply(null,dots.map(function(c){return c._d}))||1;
    return svg;
  }

  function swapIcon(el,charName){
    var s=el.querySelector('svg.led');if(s)s.remove();
    el.dataset.char=charName;
    var svg=buildSVG(el,charName);if(svg)el.insertBefore(svg,el.firstChild);
  }

  document.querySelectorAll('[data-char]').forEach(function(el){
    var svg=buildSVG(el,el.dataset.char);if(!svg)return;
    if(el.classList.contains('album'))el.appendChild(svg);else el.insertBefore(svg,el.firstChild);
  });

  function rainbow(el){if(!el._dots)return;var m=el._maxD;
    el._dots.forEach(function(c){c.style.fill='hsl('+Math.round((c._d/m)*320)+',78%,62%)';c.style.transitionDelay=(c._d*15)+'ms'});
  }
  function restore(el){if(!el._dots)return;
    el._dots.forEach(function(c){c.style.fill=el._color;c.style.transitionDelay=(c._d*10)+'ms'});
  }
  document.querySelectorAll('.btn[data-char],.mood[data-char]').forEach(function(b){
    b.addEventListener('mouseenter',function(){if(!b.disabled)rainbow(b)});
    b.addEventListener('mouseleave',function(){if(!b.disabled)restore(b)});
  });
  var album=document.querySelector('.album[data-char]');
  if(album){rainbow(album);setTimeout(function(){restore(album)},800)}

  /* ── audio engine ── */
  var audioCtx=null,masterGain=null,melodyTimer=null,audioOn=false;
  var melody=[
    {f:523.25,t:0,d:.22},{f:659.25,t:.25,d:.22},{f:783.99,t:.5,d:.22},{f:1046.5,t:.75,d:.35},
    {f:493.88,t:1.2,d:.22},{f:587.33,t:1.45,d:.22},{f:783.99,t:1.7,d:.22},{f:987.77,t:1.95,d:.35},
    {f:440,t:2.4,d:.22},{f:523.25,t:2.65,d:.22},{f:659.25,t:2.9,d:.22},{f:880,t:3.15,d:.35},
    {f:392,t:3.6,d:.22},{f:493.88,t:3.85,d:.22},{f:587.33,t:4.1,d:.22},{f:783.99,t:4.35,d:.45}
  ];
  var bass=[
    {f:130.81,t:0,d:1.1},{f:196,t:1.2,d:1.1},{f:220,t:2.4,d:1.1},{f:196,t:3.6,d:1.1}
  ];
  var LOOP=4.9;

  function initAudio(){
    if(audioCtx)return;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();masterGain.gain.value=.15;
    masterGain.connect(audioCtx.destination);
  }
  function playNote(f,t,d,type){
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.005,t+d);
    o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+d+.02);
  }
  function scheduleLoop(){
    if(!audioOn)return;
    var now=audioCtx.currentTime+.05;
    melody.forEach(function(n){playNote(n.f,now+n.t,n.d,'square')});
    bass.forEach(function(n){playNote(n.f,now+n.t,n.d,'triangle')});
    melodyTimer=setTimeout(scheduleLoop,(LOOP-.1)*1000);
  }
  function startAudio(){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();audioOn=true;scheduleLoop()}
  function stopAudio(){audioOn=false;clearTimeout(melodyTimer)}

  /* ── playback state ── */
  var TOTAL=252,pos=154,playing=false,ticker=null;
  function fmt(s){var m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+Math.floor(s%60)}
  function updateBar(){
    document.getElementById('fill').style.width=Math.min(100,Math.max(0,(pos/TOTAL)*100))+'%';
    document.getElementById('cur').textContent=fmt(pos);
  }

  /* progress seek */
  var bar=document.getElementById('bar');
  bar.addEventListener('click',function(e){
    var r=bar.getBoundingClientRect();pos=Math.round(((e.clientX-r.left)/r.width)*TOTAL);updateBar();
  });

  /* play/pause */
  var playBtn=document.getElementById('play-btn');
  function setPlay(on){
    playing=on;
    document.getElementById('play-label').textContent=on?'Pause':'Play';
    swapIcon(playBtn,on?'pause':'play');
    if(on){
      startAudio();
      ticker=setInterval(function(){if(pos<TOTAL){pos++;updateBar()}else setPlay(false)},1000);
    }else{
      stopAudio();clearInterval(ticker);
    }
  }
  playBtn.addEventListener('click',function(){setPlay(!playing)});

  /* prev / next */
  document.getElementById('prev-btn').addEventListener('click',function(){pos=0;updateBar()});
  document.getElementById('next-btn').addEventListener('click',function(){pos=TOTAL;updateBar();if(playing)setPlay(false)});

  /* ── secondary buttons ── */

  /* Like toggle (icon+text) */
  var likeBtn=document.getElementById('like-btn'),liked=false;
  likeBtn.addEventListener('click',function(){
    liked=!liked;
    likeBtn._color=liked?'#ec407a':'#90a4ae';
    likeBtn.dataset.led=likeBtn._color;restore(likeBtn);
    likeBtn.classList.toggle('toggled',liked);
  });

  /* Shuffle toggle (text-only) */
  var shuffleBtn=document.getElementById('shuffle-btn'),shuffled=false;
  shuffleBtn.addEventListener('click',function(){
    shuffled=!shuffled;
    shuffleBtn.classList.toggle('toggled',shuffled);
  });

  /* Volume mute (icon-only) */
  var volBtn=document.getElementById('vol-btn'),muted=false;
  volBtn.addEventListener('click',function(){
    muted=!muted;
    volBtn._color=muted?'#90a4ae':'#66bb6a';
    volBtn.dataset.led=volBtn._color;restore(volBtn);
    volBtn.style.opacity=muted?'.5':'1';
    if(masterGain)masterGain.gain.value=muted?0:.15;
  });

  /* ── tertiary buttons ── */

  /* Repeat cycle (icon+text): Off → All → 1x */
  var repeatBtn=document.getElementById('repeat-btn'),repeatLabel=document.getElementById('repeat-label');
  var repeatStates=['Repeat','All','1x'],repeatIdx=0;
  repeatBtn.addEventListener('click',function(){
    repeatIdx=(repeatIdx+1)%3;
    repeatLabel.textContent=repeatStates[repeatIdx];
    repeatBtn.classList.toggle('toggled',repeatIdx>0);
  });

  /* Lyrics toggle (text-only) */
  var lyricsBtn=document.getElementById('lyrics-btn'),lyricsOn=false;
  lyricsBtn.addEventListener('click',function(){
    lyricsOn=!lyricsOn;
    document.getElementById('lyrics').style.display=lyricsOn?'block':'none';
    lyricsBtn.classList.toggle('toggled',lyricsOn);
  });

  /* Queue toggle (icon-only) */
  var queueBtn=document.getElementById('queue-btn'),queueOn=false;
  queueBtn.addEventListener('click',function(){
    queueOn=!queueOn;
    queueBtn.classList.toggle('toggled',queueOn);
    queueBtn._color=queueOn?'#42a5f5':'#78909c';
    queueBtn.dataset.led=queueBtn._color;restore(queueBtn);
  });

  /* mood group */
  document.querySelectorAll('.mood').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.mood').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
    });
  });
})();
</script>
<script src="design-specs.js?v=16"></script>
</body>
</html>
