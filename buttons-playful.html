<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons · Playful</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#e0e5ec;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .player{
      width:520px;max-width:92vw;
      border-radius:28px;padding:28px;
      background:#e0e5ec;
      border:1px solid rgba(255,255,255,.55);
      box-shadow:10px 10px 20px #b0b6bf,-10px -10px 20px #ffffff;
      display:flex;flex-direction:column;
    }

    .top{display:flex;gap:16px;align-items:flex-start}
    .album{
      width:88px;height:88px;border-radius:18px;flex-shrink:0;
      background:#e0e5ec;
      box-shadow:inset 3px 3px 6px #b8bec7,inset -3px -3px 6px #ffffff;
      display:flex;align-items:center;justify-content:center;
    }
    .album svg.led{width:52px;height:52px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:6px}
    .track{font:700 15px/1.2 inherit;letter-spacing:-.02em;color:#3a4558}
    .artist{font:500 11px/1 inherit;color:#8a9bb0}

    .mood-group{display:flex;flex-direction:column;gap:5px;flex-shrink:0;padding-top:2px}
    .mood{
      display:flex;align-items:center;gap:4px;
      border:none;border-radius:10px;cursor:pointer;
      font:600 8px/1 inherit;letter-spacing:.02em;
      padding:5px 10px;min-height:26px;
      background:#e0e5ec;color:#8a9bb0;
      box-shadow:2px 2px 5px #b8bec7,-2px -2px 5px #ffffff;
      transition:box-shadow .2s ease,color .2s ease;
    }
    .mood svg.led{width:10px;height:10px;flex-shrink:0}
    .mood:hover{box-shadow:3px 3px 7px #b8bec7,-3px -3px 7px #ffffff;color:#5a6a7e}
    .mood.active{box-shadow:inset 2px 2px 5px #b8bec7,inset -2px -2px 5px #ffffff;color:#4a5568}

    .progress-row{display:flex;align-items:center;gap:8px;margin-top:16px}
    .time{font:600 8px/1 "SF Mono",monospace;color:#8a9bb0;letter-spacing:.04em;flex-shrink:0}
    .track-bar{flex:1;height:5px;border-radius:3px;background:#d0d5dc;box-shadow:inset 1px 1px 2px #b8bec7,inset -1px -1px 2px #f0f4f8;position:relative;cursor:pointer}
    .fill{width:0;height:100%;border-radius:3px;background:linear-gradient(90deg,#42a5f5,#66bb6a);position:relative;transition:width .1s ease;pointer-events:none}
    .fill::after{content:'';position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:#e0e5ec;box-shadow:2px 2px 4px #b8bec7,-2px -2px 4px #fff;transform:translateY(-50%)}

    .transport{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:5px;
      border:none;border-radius:16px;cursor:pointer;
      font-family:inherit;letter-spacing:.01em;
      background:#e0e5ec;color:#4a5568;
      box-shadow:6px 6px 12px #b8bec7,-6px -6px 12px #ffffff;
      font-weight:700;font-size:13px;
      padding:12px 24px;min-height:48px;
      position:relative;transition:box-shadow .2s ease,transform .12s ease;
    }
    .btn svg.led{width:22px;height:22px}
    .btn.icon-only{padding:12px;min-width:48px}
    .btn:focus-visible{outline:2px solid #7ea8e8;outline-offset:3px}
    .btn:hover{box-shadow:8px 8px 16px #b8bec7,-8px -8px 16px #ffffff}
    .btn:active:not(:disabled){box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #ffffff;transform:scale(.95)}

    .led circle{transition:fill .3s ease}
    html.is-preview .player{width:100%;max-width:520px}
  </style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="player">

  <div class="top">
    <div class="album" id="album" data-char="heart" data-led="#ec407a"></div>
    <div class="info">
      <div class="track" id="track-name">Pixel Dreams</div>
      <div class="artist" id="artist-name">Chiptune Orchestra</div>
    </div>
    <div class="mood-group">
      <button class="mood active" data-char="face_happy" data-led="#66bb6a">Happy</button>
      <button class="mood" data-char="face_meh" data-led="#ffa726">Chill</button>
      <button class="mood" data-char="face_mad" data-led="#ef5350">Intense</button>
    </div>
  </div>

  <div class="progress-row">
    <span class="time" id="cur">0:00</span>
    <div class="track-bar" id="bar">
      <div class="fill" id="fill"></div>
    </div>
    <span class="time" id="dur">4:12</span>
  </div>

  <div class="transport">
    <button class="btn icon-only" id="prev-btn" data-char="prev" data-led="#78909c" aria-label="Previous"></button>
    <button class="btn" id="play-btn" data-char="play" data-led="#42a5f5"><span id="play-label">Play</span></button>
    <button class="btn" id="next-btn" data-char="next" data-led="#78909c">Skip</button>
  </div>

</div>

<script>
(function(){
  var px={
    play:'.X......./.XX....../.XXX...../.XXXX..../.XXXXX.../.XXXX..../.XXX...../.XX....../.X.......',
    pause:'.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX./.XX..XX.',
    prev:'X.....X./X....XX./X...XXX./X..XXXX./X.XXXXX./X..XXXX./X...XXX./X....XX./X.....X.',
    next:'.X.....X/.XX....X/.XXX...X/.XXXX..X/.XXXXX.X/.XXXX..X/.XXX...X/.XX....X/.X.....X',
    heart:'.XX...XX./XXXX.XXXX/XXXXXXXXX/XXXXXXXXX/.XXXXXXX./..XXXXX./...XXX./....X....',
    face_happy:'..XXXXX../.X.....X./X..X.X..X/X.......X/X.X...X.X/X..XXX..X/.X.....X./..XXXXX..',
    face_meh:'..XXXXX../.X.....X./X..X.X..X/X.......X/X.......X/X.XXXXX.X/.X.....X./..XXXXX..',
    face_mad:'..XXXXX../.X.....X./X.X...X.X/X..X.X..X/X.......X/X..XXX..X/X.X...X.X/.X.....X./..XXXXX..'
  };

  var playlist=[
    {track:'Pixel Dreams',artist:'Chiptune Orchestra',dur:252,art:'#ec407a'},
    {track:'Neon Cascade',artist:'Bit Harmony',dur:198,art:'#42a5f5'},
    {track:'Circuit Breeze',artist:'Retro Wave',dur:276,art:'#66bb6a'}
  ];
  var songIdx=0;

  var ns='http://www.w3.org/2000/svg';

  function buildSVG(el,charName){
    var data=px[charName];if(!data)return;
    var color=el.dataset.led||'#ffa726';
    var rows=data.split('/');
    var h=rows.length,w=Math.max.apply(null,rows.map(function(r){return r.length}));
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('class','led');
    var dim=document.createElementNS(ns,'g'),lit=document.createElementNS(ns,'g');
    lit.setAttribute('filter','url(#glow)');svg.appendChild(dim);svg.appendChild(lit);
    var dots=[];
    rows.forEach(function(row,y){for(var x=0;x<w;x++){
      var on=x<row.length&&row[x]==='X';
      var c=document.createElementNS(ns,'circle');
      c.setAttribute('cx',x+.5);c.setAttribute('cy',y+.5);c.setAttribute('r',on?.34:.18);
      if(on){c.setAttribute('fill',color);c._d=x+y;lit.appendChild(c);dots.push(c)}
      else{c.setAttribute('fill','rgba(120,130,145,0.13)');dim.appendChild(c)}
    }});
    el._dots=dots;el._color=color;
    el._maxD=Math.max.apply(null,dots.map(function(c){return c._d}))||1;
    return svg;
  }

  function swapIcon(el,charName){
    var s=el.querySelector('svg.led');if(s)s.remove();
    el.dataset.char=charName;
    var svg=buildSVG(el,charName);if(svg)el.insertBefore(svg,el.firstChild);
  }

  document.querySelectorAll('[data-char]').forEach(function(el){
    var svg=buildSVG(el,el.dataset.char);if(!svg)return;
    if(el.classList.contains('album'))el.appendChild(svg);else el.insertBefore(svg,el.firstChild);
  });

  function rainbow(el){if(!el._dots)return;var m=el._maxD;
    el._dots.forEach(function(c){c.style.fill='hsl('+Math.round((c._d/m)*320)+',78%,62%)';c.style.transitionDelay=(c._d*15)+'ms'});
  }
  function restore(el){if(!el._dots)return;
    el._dots.forEach(function(c){c.style.fill=el._color;c.style.transitionDelay=(c._d*10)+'ms'});
  }
  document.querySelectorAll('.btn[data-char],.mood[data-char]').forEach(function(b){
    b.addEventListener('mouseenter',function(){if(!b.disabled)rainbow(b)});
    b.addEventListener('mouseleave',function(){if(!b.disabled)restore(b)});
  });
  var album=document.getElementById('album');
  if(album){rainbow(album);setTimeout(function(){restore(album)},800)}

  /* ── audio ── */
  var audioCtx=null,masterGain=null,melodyTimer=null,audioOn=false;
  var melodies=[
    [{f:523.25,t:0,d:.22},{f:659.25,t:.25,d:.22},{f:783.99,t:.5,d:.22},{f:1046.5,t:.75,d:.35},
     {f:493.88,t:1.2,d:.22},{f:587.33,t:1.45,d:.22},{f:783.99,t:1.7,d:.22},{f:987.77,t:1.95,d:.35},
     {f:440,t:2.4,d:.22},{f:523.25,t:2.65,d:.22},{f:659.25,t:2.9,d:.22},{f:880,t:3.15,d:.35},
     {f:392,t:3.6,d:.22},{f:493.88,t:3.85,d:.22},{f:587.33,t:4.1,d:.22},{f:783.99,t:4.35,d:.45}],
    [{f:659.25,t:0,d:.18},{f:783.99,t:.2,d:.18},{f:880,t:.4,d:.3},{f:783.99,t:.8,d:.18},
     {f:659.25,t:1,d:.18},{f:587.33,t:1.2,d:.3},{f:523.25,t:1.6,d:.18},{f:587.33,t:1.8,d:.18},
     {f:659.25,t:2,d:.3},{f:783.99,t:2.4,d:.18},{f:880,t:2.6,d:.18},{f:1046.5,t:2.8,d:.4},
     {f:880,t:3.3,d:.18},{f:783.99,t:3.5,d:.18},{f:659.25,t:3.7,d:.4}],
    [{f:392,t:0,d:.3},{f:440,t:.35,d:.22},{f:523.25,t:.6,d:.22},{f:587.33,t:.85,d:.35},
     {f:523.25,t:1.3,d:.22},{f:440,t:1.55,d:.22},{f:392,t:1.8,d:.35},{f:349.23,t:2.2,d:.22},
     {f:392,t:2.45,d:.22},{f:440,t:2.7,d:.35},{f:523.25,t:3.1,d:.22},{f:587.33,t:3.35,d:.22},
     {f:659.25,t:3.6,d:.22},{f:783.99,t:3.85,d:.45}]
  ];
  var basses=[
    [{f:130.81,t:0,d:1.1},{f:196,t:1.2,d:1.1},{f:220,t:2.4,d:1.1},{f:196,t:3.6,d:1.1}],
    [{f:164.81,t:0,d:1},{f:146.83,t:1,d:1},{f:130.81,t:2,d:1},{f:164.81,t:3,d:1}],
    [{f:196,t:0,d:1.1},{f:174.61,t:1.2,d:1.1},{f:196,t:2.4,d:1.1},{f:220,t:3.6,d:1.1}]
  ];
  var LOOP=4.9;

  function initAudio(){
    if(audioCtx)return;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();masterGain.gain.value=.15;
    masterGain.connect(audioCtx.destination);
  }
  function playNote(f,t,d,type){
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.005,t+d);
    o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+d+.02);
  }
  function scheduleLoop(){
    if(!audioOn)return;
    var now=audioCtx.currentTime+.05;
    melodies[songIdx].forEach(function(n){playNote(n.f,now+n.t,n.d,'square')});
    basses[songIdx].forEach(function(n){playNote(n.f,now+n.t,n.d,'triangle')});
    melodyTimer=setTimeout(scheduleLoop,(LOOP-.1)*1000);
  }
  function startAudio(){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();audioOn=true;scheduleLoop()}
  function stopAudio(){audioOn=false;clearTimeout(melodyTimer)}

  /* ── playback ── */
  var pos=0,playing=false,ticker=null;
  function fmt(s){var m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+Math.floor(s%60)}
  function curSong(){return playlist[songIdx]}

  function loadSong(){
    var s=curSong();
    document.getElementById('track-name').textContent=s.track;
    document.getElementById('artist-name').textContent=s.artist;
    document.getElementById('dur').textContent=fmt(s.dur);
    pos=0;updateBar();
    album.dataset.led=s.art;album._color=s.art;
    var oldSvg=album.querySelector('svg.led');if(oldSvg)oldSvg.remove();
    var svg=buildSVG(album,'heart');if(svg)album.appendChild(svg);
    rainbow(album);setTimeout(function(){restore(album)},600);
  }

  function updateBar(){
    var pct=Math.min(100,Math.max(0,(pos/curSong().dur)*100));
    document.getElementById('fill').style.width=pct+'%';
    document.getElementById('cur').textContent=fmt(pos);
  }

  var bar=document.getElementById('bar');
  bar.addEventListener('click',function(e){
    var r=bar.getBoundingClientRect();
    pos=Math.round(((e.clientX-r.left)/r.width)*curSong().dur);updateBar();
  });

  var playBtn=document.getElementById('play-btn');
  function setPlay(on){
    playing=on;
    document.getElementById('play-label').textContent=on?'Pause':'Play';
    swapIcon(playBtn,on?'pause':'play');
    if(on){
      startAudio();
      ticker=setInterval(function(){
        if(pos<curSong().dur){pos++;updateBar()}
        else{songIdx=(songIdx+1)%playlist.length;loadSong();stopAudio();startAudio()}
      },1000);
    }else{stopAudio();clearInterval(ticker)}
  }
  playBtn.addEventListener('click',function(){setPlay(!playing)});

  /* prev: go to previous song */
  document.getElementById('prev-btn').addEventListener('click',function(){
    songIdx=(songIdx-1+playlist.length)%playlist.length;
    loadSong();
    if(playing){stopAudio();startAudio()}
  });

  /* skip: go to next song */
  document.getElementById('next-btn').addEventListener('click',function(){
    songIdx=(songIdx+1)%playlist.length;
    loadSong();
    if(playing){stopAudio();startAudio()}
  });

  /* mood group */
  document.querySelectorAll('.mood').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.mood').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
    });
  });

  loadSong();
})();
</script>
<script src="design-specs.js?v=17"></script>
</body>
</html>
