<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons · Playful</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#e0e5ec;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .frame{
      width:580px;max-width:88vw;aspect-ratio:4/3;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      padding:28px;
    }

    .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
    .row-label{
      width:100%;text-align:center;
      font:600 9px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
      color:#8a9bb0;margin-bottom:-4px;
    }

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:none;border-radius:14px;cursor:pointer;
      font:500 11px/1 inherit;letter-spacing:.01em;
      padding:10px 16px;min-height:44px;
      background:#e0e5ec;color:#5a6a7e;
      position:relative;transition:box-shadow .2s ease,transform .1s ease;
    }
    .btn:focus-visible{outline:2px solid #7ea8e8;outline-offset:3px}
    .btn svg.led{width:22px;height:22px;flex-shrink:0}
    .btn.icon-only{padding:10px;min-width:44px}

    .btn.primary{
      box-shadow:5px 5px 10px #b8bec7,-5px -5px 10px #ffffff;
      font-weight:600;color:#4a5568;
    }
    .btn.primary:hover{box-shadow:7px 7px 14px #b8bec7,-7px -7px 14px #ffffff}
    .btn.primary:active:not(:disabled){box-shadow:inset 3px 3px 6px #b8bec7,inset -3px -3px 6px #ffffff;transform:scale(.97)}
    .btn.primary:disabled{box-shadow:2px 2px 4px #c8cdd5,-2px -2px 4px #f0f4f8;color:#a0adb8;cursor:default}

    .btn.secondary{
      box-shadow:3px 3px 7px #b8bec7,-3px -3px 7px #ffffff;
    }
    .btn.secondary:hover{box-shadow:5px 5px 10px #b8bec7,-5px -5px 10px #ffffff}
    .btn.secondary:active:not(:disabled){box-shadow:inset 2px 2px 5px #b8bec7,inset -2px -2px 5px #ffffff;transform:scale(.97)}
    .btn.secondary:disabled{box-shadow:1px 1px 3px #c8cdd5,-1px -1px 3px #f0f4f8;color:#a0adb8;cursor:default}

    .btn.tertiary{
      box-shadow:inset 2px 2px 5px #b8bec7,inset -2px -2px 5px #ffffff;
    }
    .btn.tertiary:hover{box-shadow:inset 3px 3px 7px #b0b6bf,inset -3px -3px 7px #ffffff}
    .btn.tertiary:active:not(:disabled){box-shadow:inset 4px 4px 9px #aeb4bd,inset -4px -4px 9px #ffffff;transform:scale(.97)}
    .btn.tertiary:disabled{box-shadow:inset 1px 1px 3px #c8cdd5,inset -1px -1px 3px #f0f4f8;color:#a0adb8;cursor:default}

    .btn-group{
      display:inline-flex;border-radius:14px;overflow:hidden;
      box-shadow:4px 4px 8px #b8bec7,-4px -4px 8px #ffffff;
    }
    .btn-group .btn{
      box-shadow:none;border-radius:0;
      flex-direction:column;gap:3px;padding:8px 16px;min-height:54px;
    }
    .btn-group .btn:first-child{border-radius:14px 0 0 14px}
    .btn-group .btn:last-child{border-radius:0 14px 14px 0}
    .btn-group .btn+.btn{box-shadow:inset 1px 0 0 #d0d5dc}
    .btn-group .btn:hover{background:#d8dde5}
    .btn-group .btn.active{
      background:#d6dbe3;
      box-shadow:inset 3px 3px 6px #b8bec7,inset -3px -3px 6px #f0f4f8;
    }
    .btn-group .btn svg.led{width:18px;height:18px}

    .states{display:flex;gap:10px;align-items:center;justify-content:center}
    .state-label{font:500 8px/1 inherit;color:#8a9bb0;text-align:center;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}

    .led circle{transition:fill .3s ease}

    html.is-preview .frame{aspect-ratio:auto;width:100%;height:100%}
  </style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="frame">

  <div class="row">
    <span class="row-label">Actions</span>
    <button class="btn primary" data-char="sword" data-led="#ffa726">New Game</button>
    <button class="btn primary" data-char="play" data-led="#42a5f5">Continue</button>
    <button class="btn primary icon-only" data-char="heart" data-led="#ec407a" aria-label="Lives"></button>
  </div>

  <div class="row">
    <span class="row-label">Utilities</span>
    <button class="btn secondary" data-char="bag" data-led="#8d6e63">Inventory</button>
    <button class="btn secondary" data-char="crown" data-led="#ffd54f">Scores</button>
    <button class="btn secondary icon-only" data-char="speaker" data-led="#66bb6a" aria-label="Sound"></button>
  </div>

  <div class="row">
    <span class="row-label">Options</span>
    <button class="btn tertiary" data-char="help" data-led="#42a5f5">Rules</button>
    <button class="btn tertiary" data-char="power" data-led="#ef5350">Quit</button>
    <button class="btn tertiary icon-only" data-char="gear" data-led="#78909c" aria-label="Settings"></button>
  </div>

  <div class="row">
    <span class="row-label">Difficulty</span>
    <div class="btn-group">
      <button class="btn active" data-char="face_happy" data-led="#66bb6a">Easy</button>
      <button class="btn" data-char="face_meh" data-led="#ffa726">Normal</button>
      <button class="btn" data-char="face_mad" data-led="#ef5350">Hard</button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">States</span>
    <div class="states">
      <div><button class="btn primary" data-char="play" data-led="#ffa726">Play</button><div class="state-label">Enabled</div></div>
      <div><button class="btn primary" data-char="play" data-led="#ffca28" style="box-shadow:7px 7px 14px #b8bec7,-7px -7px 14px #ffffff">Play</button><div class="state-label">Hover</div></div>
      <div><button class="btn primary" data-char="play" data-led="#ff7043" style="box-shadow:inset 3px 3px 6px #b8bec7,inset -3px -3px 6px #ffffff">Play</button><div class="state-label">Pressed</div></div>
      <div><button class="btn primary" data-char="play" data-led="#90a4ae" disabled>Play</button><div class="state-label">Disabled</div></div>
    </div>
  </div>

</div>

<script>
(function(){
  var px={
    sword:
      '....X....'+
      '/....X....'+
      '/...XXX...'+
      '/...XXX...'+
      '/...XXX...'+
      '/..XXXXX..'+
      '/.X.XXX.X.'+
      '/....X....'+
      '/...XXX...',
    play:
      '.X.......'+
      '/.XX......'+
      '/.XXX.....'+
      '/.XXXX....'+
      '/.XXXXX...'+
      '/.XXXX....'+
      '/.XXX.....'+
      '/.XX......'+
      '/.X.......',
    heart:
      '.XX...XX.'+
      '/XXXX.XXXX'+
      '/XXXXXXXXX'+
      '/XXXXXXXXX'+
      '/.XXXXXXX.'+
      '/..XXXXX..'+
      '/...XXX...'+
      '/....X....',
    bag:
      '...XXX...'+
      '/..X...X..'+
      '/..X...X..'+
      '/.XXXXXXX.'+
      '/X.......X'+
      '/X.......X'+
      '/X.......X'+
      '/X.......X'+
      '/.XXXXXXX.',
    crown:
      'X...X...X'+
      '/XX..X..XX'+
      '/.XX.X.XX.'+
      '/..XXXXX..'+
      '/..XXXXX..'+
      '/..XXXXX..'+
      '/..XXXXX..'+
      '/.XXXXXXX.',
    speaker:
      '..X......'+
      '/..XX.....'+
      '/XXXXX.X..'+
      '/XXXXX.X.X'+
      '/XXXXX.X..'+
      '/..XX.....'+
      '/..X......',
    help:
      '/..XXXXX..'+
      '/.XX...XX.'+
      '/.XX...XX.'+
      '/......XX.'+
      '/....XXX..'+
      '/...XX....'+
      '/.........'+
      '/...XX....'+
      '/...XX....',
    power:
      '....X....'+
      '/....X....'+
      '/..X...X..'+
      '/.X..X..X.'+
      '/X...X...X'+
      '/X.......X'+
      '/.X.....X.'+
      '/..X...X..'+
      '/...XXX...',
    gear:
      '/.X.XXX.X.'+
      '/XX.....XX'+
      '/X.......X'+
      '/XXX...XXX'+
      '/X.......X'+
      '/XX.....XX'+
      '/.X.XXX.X.',
    face_happy:
      '..XXXXX..'+
      '/.X.....X.'+
      '/X..X.X..X'+
      '/X.......X'+
      '/X.X...X.X'+
      '/X..XXX..X'+
      '/.X.....X.'+
      '/..XXXXX..',
    face_meh:
      '..XXXXX..'+
      '/.X.....X.'+
      '/X..X.X..X'+
      '/X.......X'+
      '/X.......X'+
      '/X.XXXXX.X'+
      '/.X.....X.'+
      '/..XXXXX..',
    face_mad:
      '..XXXXX..'+
      '/.X.....X.'+
      '/X.X...X.X'+
      '/X..X.X..X'+
      '/X.......X'+
      '/X..XXX..X'+
      '/X.X...X.X'+
      '/.X.....X.'+
      '/..XXXXX..'
  };

  var ns='http://www.w3.org/2000/svg';

  document.querySelectorAll('[data-char]').forEach(function(el){
    var data=px[el.dataset.char];
    if(!data)return;
    var color=el.dataset.led||'#ffa726';
    var rows=data.split('/');
    var h=rows.length;
    var w=Math.max.apply(null,rows.map(function(r){return r.length}));

    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    svg.setAttribute('class','led');

    var dim=document.createElementNS(ns,'g');
    var lit=document.createElementNS(ns,'g');
    lit.setAttribute('filter','url(#glow)');
    svg.appendChild(dim);svg.appendChild(lit);

    var dots=[];
    rows.forEach(function(row,y){
      for(var x=0;x<w;x++){
        var on=x<row.length&&row[x]==='X';
        var c=document.createElementNS(ns,'circle');
        c.setAttribute('cx',x+.5);c.setAttribute('cy',y+.5);
        c.setAttribute('r',on?.34:.18);
        if(on){
          c.setAttribute('fill',color);
          c._d=x+y;lit.appendChild(c);dots.push(c);
        }else{
          c.setAttribute('fill','rgba(120,130,145,0.13)');
          dim.appendChild(c);
        }
      }
    });

    el._dots=dots;el._color=color;
    el._maxD=Math.max.apply(null,dots.map(function(c){return c._d}))||1;
    el.insertBefore(svg,el.firstChild);
  });

  function rainbow(el){
    if(!el._dots)return;var m=el._maxD;
    el._dots.forEach(function(c){
      var t=c._d/m;var hue=Math.round(t*320);
      c.style.fill='hsl('+hue+',78%,62%)';
      c.style.transitionDelay=(c._d*15)+'ms';
    });
  }
  function restore(el){
    if(!el._dots)return;
    el._dots.forEach(function(c){
      c.style.fill=el._color;
      c.style.transitionDelay=(c._d*10)+'ms';
    });
  }

  document.querySelectorAll('.btn[data-char]').forEach(function(btn){
    if(btn.closest('.states'))return;
    btn.addEventListener('mouseenter',function(){if(!btn.disabled)rainbow(btn)});
    btn.addEventListener('mouseleave',function(){if(!btn.disabled)restore(btn)});
  });

  document.querySelectorAll('.btn-group .btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      btn.closest('.btn-group').querySelectorAll('.btn').forEach(function(b){
        b.classList.remove('active');
      });
      btn.classList.add('active');
    });
  });
})();
</script>
<script src="design-specs.js?v=11"></script>
</body>
</html>
