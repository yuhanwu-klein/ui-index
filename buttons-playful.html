<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons · Playful</title>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#fff;font-family:'Silkscreen',monospace}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .frame{
      width:560px;max-width:85vw;aspect-ratio:4/3;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
      padding:28px;
    }

    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
    .row-label{
      width:100%;text-align:center;
      font:700 9px/1 'Silkscreen',monospace;letter-spacing:.08em;text-transform:uppercase;
      color:#c0c0c0;margin-bottom:-8px;
    }

    /* pixel button base */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      border:2px solid #2a2a2a;
      border-radius:0;cursor:pointer;
      font:400 11px/1 'Silkscreen',monospace;
      padding:8px 16px;min-height:36px;
      position:relative;
      transition:transform .1s;
      image-rendering:pixelated;
    }
    .btn:focus-visible{outline:2px solid #ff6b9d;outline-offset:2px}
    .btn svg{width:14px;height:14px;flex-shrink:0;shape-rendering:crispEdges}
    .btn.icon-only{padding:8px;min-width:36px}
    .btn:active:not(:disabled){transform:translate(2px,2px)}

    /* primary — solid fill with pixel shadow */
    .btn.primary{
      background:#2a2a2a;color:#fff;
      box-shadow:3px 3px 0 #2a2a2a;
    }
    .btn.primary:hover{
      background:#ff6b9d;border-color:#ff6b9d;
      box-shadow:3px 3px 0 #d44a7a;
    }
    .btn.primary:active{box-shadow:0 0 0 #2a2a2a}
    .btn.primary:disabled{background:#d0d0d0;border-color:#d0d0d0;color:#f5f5f5;box-shadow:3px 3px 0 #b8b8b8;cursor:default}
    .btn.primary svg{fill:#fff}

    /* secondary — light fill */
    .btn.secondary{
      background:#fff;color:#2a2a2a;
      box-shadow:3px 3px 0 #2a2a2a;
    }
    .btn.secondary:hover{
      background:#ffeaa7;border-color:#2a2a2a;
    }
    .btn.secondary:active{box-shadow:0 0 0 #2a2a2a}
    .btn.secondary:disabled{background:#f5f5f5;border-color:#d0d0d0;color:#d0d0d0;box-shadow:3px 3px 0 #d0d0d0;cursor:default}
    .btn.secondary svg{fill:#2a2a2a}
    .btn.secondary:disabled svg{fill:#d0d0d0}

    /* tertiary — dashed border */
    .btn.tertiary{
      background:transparent;color:#2a2a2a;
      border-style:dashed;
    }
    .btn.tertiary:hover{
      background:#e8f8ff;border-color:#55c6f0;color:#2a2a2a;
      border-style:solid;
    }
    .btn.tertiary:active{background:#d0f0ff}
    .btn.tertiary:disabled{color:#d0d0d0;border-color:#d0d0d0;cursor:default}
    .btn.tertiary svg{fill:#2a2a2a}
    .btn.tertiary:disabled svg{fill:#d0d0d0}

    /* pixel icons — inline SVG pixel art */
    .px-star{display:inline-block;width:14px;height:14px;background:currentColor;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
    .px-heart{display:inline-block;width:14px;height:14px;background:currentColor;clip-path:polygon(50% 90%,15% 55%,0% 35%,0% 18%,15% 0%,35% 0%,50% 18%,65% 0%,85% 0%,100% 18%,100% 35%,85% 55%)}

    /* button group */
    .btn-group{display:inline-flex;gap:0}
    .btn-group .btn{box-shadow:none;border-right-width:0}
    .btn-group .btn:last-child{border-right-width:2px}
    .btn-group .btn{background:#fff;color:#2a2a2a}
    .btn-group .btn:hover{background:#ffeaa7}
    .btn-group .btn.active{background:#2a2a2a;color:#fff}

    /* states */
    .states{display:flex;gap:8px;align-items:center;justify-content:center}
    .state-label{
      font:400 8px/1 'Silkscreen',monospace;
      color:#c0c0c0;min-width:50px;text-align:center;margin-top:4px;
    }
    .btn.is-hover.primary{background:#ff6b9d;border-color:#ff6b9d;box-shadow:3px 3px 0 #d44a7a}
    .btn.is-pressed.primary{background:#ff6b9d;border-color:#ff6b9d;box-shadow:0 0 0;transform:translate(2px,2px)}

    /* rainbow hover on primary buttons */
    .btn.primary:not(:disabled){--h:0;animation:none}
    .btn.primary:hover:not(:disabled){animation:rainbow-bg .8s linear infinite}
    @keyframes rainbow-bg{
      0%{background:hsl(0,80%,65%);border-color:hsl(0,80%,55%);box-shadow:3px 3px 0 hsl(0,80%,45%)}
      16%{background:hsl(40,80%,65%);border-color:hsl(40,80%,55%);box-shadow:3px 3px 0 hsl(40,80%,45%)}
      33%{background:hsl(120,60%,60%);border-color:hsl(120,60%,50%);box-shadow:3px 3px 0 hsl(120,60%,40%)}
      50%{background:hsl(190,80%,60%);border-color:hsl(190,80%,50%);box-shadow:3px 3px 0 hsl(190,80%,40%)}
      66%{background:hsl(260,70%,65%);border-color:hsl(260,70%,55%);box-shadow:3px 3px 0 hsl(260,70%,45%)}
      83%{background:hsl(320,75%,65%);border-color:hsl(320,75%,55%);box-shadow:3px 3px 0 hsl(320,75%,45%)}
      100%{background:hsl(360,80%,65%);border-color:hsl(360,80%,55%);box-shadow:3px 3px 0 hsl(360,80%,45%)}
    }

    html.is-preview .frame{aspect-ratio:auto;width:100%;height:100%}
  </style>
</head>
<body>
<div class="frame">

  <!-- Primary — main game actions -->
  <div class="row">
    <span class="row-label">Primary</span>
    <button class="btn primary">
      <span class="px-star" style="background:#fff"></span>
      New Game
    </button>
    <button class="btn primary">Continue</button>
    <button class="btn primary icon-only" aria-label="Heart / Lives">
      <span class="px-heart" style="background:#fff"></span>
    </button>
  </div>

  <!-- Secondary — utility game actions -->
  <div class="row">
    <span class="row-label">Secondary</span>
    <button class="btn secondary">
      <svg viewBox="0 0 14 14"><rect x="1" y="1" width="4" height="4"/><rect x="1" y="9" width="4" height="4"/><rect x="9" y="1" width="4" height="4"/><rect x="9" y="9" width="4" height="4"/></svg>
      Inventory
    </button>
    <button class="btn secondary">Leaderboard</button>
    <button class="btn secondary icon-only" aria-label="Sound toggle">
      <svg viewBox="0 0 14 14"><rect x="1" y="5" width="2" height="4"/><rect x="3" y="4" width="2" height="6"/><rect x="5" y="3" width="2" height="8"/><rect x="9" y="4" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/><rect x="11" y="3" width="2" height="2"/><rect x="11" y="9" width="2" height="2"/></svg>
    </button>
  </div>

  <!-- Tertiary — minor game actions -->
  <div class="row">
    <span class="row-label">Tertiary</span>
    <button class="btn tertiary">
      <svg viewBox="0 0 14 14"><rect x="6" y="1" width="2" height="2"/><rect x="6" y="5" width="2" height="2"/><rect x="6" y="9" width="2" height="2"/><rect x="4" y="3" width="2" height="2"/><rect x="8" y="3" width="2" height="2"/><rect x="2" y="5" width="2" height="2"/><rect x="10" y="5" width="2" height="2"/></svg>
      How to Play
    </button>
    <button class="btn tertiary">Quit</button>
    <button class="btn tertiary icon-only" aria-label="Settings">
      <svg viewBox="0 0 14 14"><rect x="1" y="2" width="12" height="2"/><rect x="1" y="6" width="12" height="2"/><rect x="1" y="10" width="12" height="2"/><rect x="3" y="1" width="2" height="4"/><rect x="9" y="5" width="2" height="4"/><rect x="5" y="9" width="2" height="4"/></svg>
    </button>
  </div>

  <!-- Button group — game mode select -->
  <div class="row">
    <span class="row-label">Button Group</span>
    <div class="btn-group">
      <button class="btn active">Easy</button>
      <button class="btn">Normal</button>
      <button class="btn">Hard</button>
    </div>
  </div>

  <!-- States -->
  <div class="row">
    <span class="row-label">States</span>
    <div class="states">
      <div style="text-align:center"><button class="btn primary">Play</button><div class="state-label">Enabled</div></div>
      <div style="text-align:center"><button class="btn primary is-hover" style="background:#ff6b9d;border-color:#ff6b9d;box-shadow:3px 3px 0 #d44a7a">Play</button><div class="state-label">Hover</div></div>
      <div style="text-align:center"><button class="btn primary is-pressed" style="box-shadow:0 0 0;transform:translate(2px,2px)">Play</button><div class="state-label">Pressed</div></div>
      <div style="text-align:center"><button class="btn primary" disabled>Play</button><div class="state-label">Disabled</div></div>
    </div>
  </div>

</div>
<script src="design-specs.js?v=8"></script>
</body>
</html>
