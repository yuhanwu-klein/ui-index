<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambient Sound · Continuous Slider</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#20201f;--page:#fff;--panel:#f1f1f3;--soft:#e4e4e7;--muted:#85858a;--line:rgba(32,32,31,.09);--pct:38%;--font:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"SF Mono","Courier New",monospace;--ease:cubic-bezier(.22,.9,.28,1);--pop:cubic-bezier(.2,1.35,.35,1)}
    html,body{width:100%;height:100%;margin:0;background:var(--page)}
    body{display:grid;place-items:center;padding:72px 24px;color:var(--ink);font-family:var(--font);overflow:hidden}
    html.is-preview body{padding:32px 24px}
    .panel{position:relative;width:min(100%,420px);padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 8px 24px rgba(32,32,31,.07)}
    .head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
    .kicker{display:block;margin-bottom:7px;color:var(--muted);font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
    .title{margin:0;font-size:16px;font-weight:700;line-height:1;letter-spacing:-.02em}
    .value{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
    .unit{margin-left:2px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
    .stage{position:relative;height:104px;padding:0 8px;border-radius:14px;background:rgba(255,255,255,.48)}
    .track-area{position:absolute;left:24px;right:24px;top:43px;height:6px}
    .rail{position:absolute;inset:0;border-radius:999px;background:#cfcfd3}
    .fill{position:absolute;inset:0 auto 0 0;width:var(--pct);border-radius:999px;background:var(--ink);transition:width 80ms linear}
    .thumb{position:absolute;z-index:4;left:var(--pct);top:3px;width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;box-shadow:0 5px 12px rgba(32,32,31,.14);transform:translate(-50%,-50%);pointer-events:none;transition:left 80ms linear,transform 260ms var(--pop),box-shadow 220ms ease}
    .thumb::before{content:"";position:absolute;inset:8px;border:1.5px solid var(--ink);border-radius:50%;transition:inset 260ms var(--pop),background-color 220ms ease}
    .thumb::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--ink)}
    .ripple{position:absolute;z-index:3;left:var(--pct);top:3px;width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.5);pointer-events:none}
    .stage.dragging .ripple{animation:pulse 760ms ease-out infinite}
    .stage:hover .thumb{box-shadow:0 7px 16px rgba(32,32,31,.18);transform:translate(-50%,-50%) scale(1.08)}
    .stage.dragging .thumb{transform:translate(-50%,-50%) scale(.9)}
    .stage.dragging .thumb::before{inset:10px;background:var(--ink)}
    .ends{position:absolute;left:20px;right:20px;top:69px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:600;pointer-events:none}
    .range{position:absolute;z-index:6;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}
    .range:active{cursor:grabbing}
    .stage:has(.range:focus-visible){outline:1.5px solid var(--ink);outline-offset:7px}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:14px;color:var(--muted);font-size:12px}
    .footer strong{color:var(--ink);font-weight:650}
    .status{font:700 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
    @keyframes pulse{0%{opacity:.25;transform:translate(-50%,-50%) scale(.55)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.05)}}
    @media(max-width:480px){body{padding:68px 16px 28px}.panel{padding:18px}.value{font-size:25px}.track-area{left:20px;right:20px}.ends{left:16px;right:16px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    design-specs{position:fixed}
  </style>
</head>
<body>
  <main class="panel" aria-label="Continuous ambient sound control">
    <header class="head"><div><span class="kicker">Sound level</span><h1 class="title">Ambient sound</h1></div><output class="value" id="value" for="volume">38<span class="unit">%</span></output></header>
    <div class="stage" id="stage">
      <div class="track-area" aria-hidden="true"><span class="rail"></span><span class="fill"></span><span class="ripple"></span><span class="thumb"></span></div>
      <div class="ends" aria-hidden="true"><span>Quiet</span><span>Immersive</span></div>
      <input class="range" id="volume" type="range" min="0" max="100" step="1" value="38" aria-label="Ambient sound volume" aria-valuetext="38 percent, balanced">
    </div>
    <footer class="footer"><span>Preset: <strong>Soft rain</strong></span><span class="status" id="status">Balanced</span></footer>
  </main>
  <script>
    const root=document.documentElement,input=document.getElementById('volume'),output=document.getElementById('value'),stage=document.getElementById('stage'),status=document.getElementById('status');
    function level(value){return value===0?'Muted':value<30?'Quiet':value<70?'Balanced':'Immersive'}
    function render(){const value=Number(input.value),label=level(value);root.style.setProperty('--pct',`${value}%`);output.innerHTML=`${value}<span class="unit">%</span>`;status.textContent=label;input.setAttribute('aria-valuetext',`${value} percent, ${label}`)}
    input.addEventListener('input',render);input.addEventListener('pointerdown',()=>stage.classList.add('dragging'));input.addEventListener('pointerup',()=>stage.classList.remove('dragging'));input.addEventListener('pointercancel',()=>stage.classList.remove('dragging'));render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
