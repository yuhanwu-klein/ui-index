<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit Temperature · Stepped Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#f7f8fa;--muted:rgba(238,242,247,.66);--cyan:#63e6ff;--warm:#ff6b45;--pct:60%;--ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Space Mono","SF Mono",monospace;--spring:cubic-bezier(.2,1.25,.35,1)}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:72px 24px;background:#fff;color:var(--ink);font-family:var(--ui);overflow:hidden}
    html.is-preview body{padding:32px 24px}
    button,input{font:inherit}
    .panel{position:relative;width:min(100%,640px);padding:28px 30px 26px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:linear-gradient(145deg,rgba(48,54,64,.97),rgba(18,22,28,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.035),0 24px 64px rgba(14,20,28,.2);backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);overflow:hidden}
    .panel::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 18% 0,rgba(255,255,255,.13),transparent 30%),linear-gradient(105deg,transparent 58%,rgba(255,255,255,.035) 59%,transparent 66%);pointer-events:none}
    .head{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
    .title-line{display:flex;align-items:center;gap:10px}
    .label{color:rgba(244,247,250,.78);font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
    .status{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border:1px solid rgba(189,235,241,.18);border-radius:999px;background:rgba(178,232,239,.08);color:rgba(222,250,252,.8);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:color 180ms ease,background 180ms ease,border-color 180ms ease}
    .status[data-zone="cold"]{color:#a8efff;background:rgba(99,230,255,.1);border-color:rgba(99,230,255,.2)}
    .status[data-zone="hot"]{color:#ffc1ad;background:rgba(255,107,69,.1);border-color:rgba(255,107,69,.2)}
    .value{font:400 36px/1 var(--mono);letter-spacing:-.065em;text-shadow:0 0 24px rgba(255,255,255,.12)}
    .unit{margin-left:3px;color:rgba(247,248,250,.58);font-size:.48em;letter-spacing:0}
    .slider-stage{position:relative;z-index:1;height:156px;border-radius:14px;touch-action:none;cursor:grab}
    .slider-stage:active{cursor:grabbing}
    .slider-stage::after{content:"";position:absolute;z-index:8;inset:-4px 2px -2px;border:2px solid transparent;border-radius:14px;pointer-events:none;transition:border-color 140ms ease,box-shadow 140ms ease}
    .slider-stage:has(.range:focus-visible)::after{border-color:rgba(133,224,255,.78);box-shadow:0 0 0 4px rgba(99,230,255,.1)}
    .outfits{position:absolute;z-index:3;left:18px;right:18px;top:0;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}
    .outfit{display:grid;justify-items:center;gap:5px;color:rgba(238,242,247,.44);transition:color 180ms ease,transform 220ms var(--spring)}
    .icon-shell{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.025);transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease,transform 220ms var(--spring)}
    .outfit svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
    .outfit small{font:500 10px/1 var(--mono);letter-spacing:.02em}
    .outfit.active{color:#f7fbff;transform:translateY(-2px)}
    .outfit.active .icon-shell{border-color:rgba(211,249,255,.38);background:rgba(198,244,250,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(117,226,247,.16);transform:scale(1.08)}
    .track-area{position:absolute;left:18px;right:18px;top:90px;height:8px}
    .rail-shadow,.rail{position:absolute;inset:1px 0;height:6px;border-radius:999px}
    .rail-shadow{background:#06080b;box-shadow:0 1px 0 rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.35)}
    .rail{background:linear-gradient(90deg,var(--cyan),#bfefff 32%,#f6f7f8 52%,#ffd1bd 72%,var(--warm));box-shadow:0 0 14px rgba(99,230,255,.16),0 0 14px rgba(255,107,69,.12);opacity:.9}
    .nodes{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .node{width:8px;height:8px;border:2px solid rgba(236,245,249,.72);border-radius:50%;background:#222832;box-shadow:0 0 0 3px rgba(10,13,17,.6);transition:background 180ms ease,box-shadow 180ms ease,transform 180ms ease}
    .node.passed{background:#eafcff;box-shadow:0 0 0 3px rgba(10,13,17,.6),0 0 10px rgba(178,239,250,.45)}
    .node.active{transform:scale(1.28);background:#fff;box-shadow:0 0 0 3px rgba(10,13,17,.65),0 0 14px rgba(255,255,255,.62)}
    .thumb{position:absolute;z-index:5;left:var(--pct);top:4px;width:44px;height:44px;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.6),rgba(255,255,255,.12) 15%,rgba(151,171,191,.12) 42%,rgba(7,10,14,.72) 68%),linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.035));box-shadow:inset 0 2px 4px rgba(255,255,255,.23),inset 0 -8px 14px rgba(0,0,0,.36),0 10px 22px rgba(0,0,0,.42),0 0 0 6px rgba(255,255,255,.025);transform:translate(-50%,-50%);pointer-events:none;transition:left 260ms var(--spring),transform 180ms ease,box-shadow 180ms ease,filter 180ms ease}
    .thumb::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.75) 0 2px,rgba(255,255,255,.12) 3px 28%,rgba(0,0,0,.22) 62%);box-shadow:inset 0 1px 3px rgba(255,255,255,.25)}
    .thumb::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#f8fbff;box-shadow:0 0 10px rgba(255,255,255,.85);transform:translate(-50%,-50%)}
    .slider-stage:hover .thumb{filter:brightness(1.1);box-shadow:inset 0 2px 4px rgba(255,255,255,.3),inset 0 -8px 14px rgba(0,0,0,.36),0 12px 24px rgba(0,0,0,.46),0 0 20px rgba(170,234,255,.18),0 0 0 7px rgba(255,255,255,.035)}
    .slider-stage.dragging .thumb{transition:left 80ms linear,transform 100ms ease,box-shadow 140ms ease;transform:translate(-50%,-50%) scale(.94);box-shadow:inset 0 2px 4px rgba(255,255,255,.32),inset 0 -8px 14px rgba(0,0,0,.4),0 13px 26px rgba(0,0,0,.48),0 0 22px rgba(128,224,255,.2)}
    .recommendation{position:absolute;left:18px;right:18px;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:16px;color:rgba(238,242,247,.6);font-size:11px}
    .recommendation strong{color:rgba(247,250,252,.88);font-weight:600}
    .recommendation span:last-child{font:500 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
    .range{position:absolute;z-index:7;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:inherit}
    @media(max-width:680px){body{padding:66px 16px 28px}.panel{padding:22px 18px 20px}.value{font-size:32px}.outfits,.track-area,.recommendation{left:8px;right:8px}.outfit:nth-child(even) small{opacity:.7}.icon-shell{width:34px;height:34px}.outfit svg{width:21px;height:21px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    design-specs{position:fixed}
  </style>
</head>
<body>
  <main class="panel" aria-label="Stepped outfit temperature control">
    <div class="head">
      <div class="title-line"><span class="label">Outfit temperature</span><span class="status" id="status">Light layers</span></div>
      <output class="value" id="value" for="temperature">20<span class="unit">°C</span></output>
    </div>
    <div class="slider-stage" id="stage">
      <div class="outfits" aria-hidden="true">
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="M8 5 5 7 2.5 13l3 1.5L7 12v8h10v-8l1.5 2.5 3-1.5L19 7l-3-2c-.8 1.6-2.1 2.4-4 2.4S8.8 6.6 8 5Z"/><path d="M9 4c.4-1.3 1.4-2 3-2s2.6.7 3 2M12 7.5V20"/></svg></span><small>5°</small></div>
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="m8 4-4 3-2 7 3 1 2-4v9h10v-9l2 4 3-1-2-7-4-3c-.8 1.4-2.1 2.1-4 2.1S8.8 5.4 8 4Z"/><path d="m9 5 3 4 3-4M12 9v11"/></svg></span><small>10°</small></div>
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="m8 5-4 2-2 6 3 1.5L7 11v9h10v-9l2 3.5 3-1.5-2-6-4-2c-.6 1.2-2 1.8-4 1.8S8.6 6.2 8 5Z"/><path d="M9 5c.5 1 1.5 1.5 3 1.5S14.5 6 15 5"/></svg></span><small>15°</small></div>
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="m8 4-5 3 2 5 3-1v9h8v-9l3 1 2-5-5-3c-.7 1.2-2 1.8-4 1.8S8.7 5.2 8 4Z"/><path d="m8 4 4 5 4-5M12 9v11"/></svg></span><small>20°</small></div>
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="m8 4-6 3 2.5 5L8 10v10h8V10l3.5 2L22 7l-6-3c-.7 1.2-2 1.8-4 1.8S8.7 5.2 8 4Z"/><path d="M9 4c.5 1 1.5 1.5 3 1.5S14.5 5 15 4"/></svg></span><small>25°</small></div>
        <div class="outfit"><span class="icon-shell"><svg viewBox="0 0 24 24"><path d="M9 3v3L6.5 8v12h11V8L15 6V3"/><path d="M9 6c.5 1.3 1.5 2 3 2s2.5-.7 3-2M9 3h2v3M13 6V3h2"/></svg></span><small>30°</small></div>
      </div>
      <div class="track-area" id="track" aria-hidden="true">
        <span class="rail-shadow"></span><span class="rail"></span>
        <div class="nodes"><span class="node"></span><span class="node"></span><span class="node"></span><span class="node"></span><span class="node"></span><span class="node"></span></div>
        <span class="thumb"></span>
      </div>
      <div class="recommendation" aria-hidden="true"><span>Recommended: <strong id="recommendation">Light jacket</strong></span><span id="position">04 / 06</span></div>
      <input class="range" id="temperature" type="range" min="5" max="30" step="5" value="20" aria-label="Outfit temperature" aria-valuetext="20 degrees Celsius, light jacket">
    </div>
  </main>
  <script>
    const options=[
      {temp:5,status:'Insulated',item:'Heavy parka',zone:'cold'},
      {temp:10,status:'Winter layers',item:'Wool coat',zone:'cold'},
      {temp:15,status:'Warm layers',item:'Knit sweater',zone:'neutral'},
      {temp:20,status:'Light layers',item:'Light jacket',zone:'neutral'},
      {temp:25,status:'Warm weather',item:'Cotton T-shirt',zone:'hot'},
      {temp:30,status:'Hot weather',item:'Sleeveless top',zone:'hot'}
    ];
    const root=document.documentElement,stage=document.getElementById('stage'),track=document.getElementById('track'),input=document.getElementById('temperature'),output=document.getElementById('value'),status=document.getElementById('status'),recommendation=document.getElementById('recommendation'),position=document.getElementById('position'),outfits=[...document.querySelectorAll('.outfit')],nodes=[...document.querySelectorAll('.node')];
    function render(){const value=Number(input.value),index=(value-5)/5,option=options[index],pct=index/(options.length-1)*100;root.style.setProperty('--pct',`${pct}%`);output.innerHTML=`${option.temp}<span class="unit">°C</span>`;status.textContent=option.status;status.dataset.zone=option.zone;recommendation.textContent=option.item;position.textContent=`${String(index+1).padStart(2,'0')} / 06`;input.setAttribute('aria-valuetext',`${option.temp} degrees Celsius, ${option.item}`);outfits.forEach((item,i)=>item.classList.toggle('active',i===index));nodes.forEach((node,i)=>{node.classList.toggle('passed',i<=index);node.classList.toggle('active',i===index)})}
    function selectFromPointer(event){const rect=track.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),index=Math.round(ratio*(options.length-1)),value=options[index].temp;if(Number(input.value)!==value){input.value=String(value);render()}}
    stage.addEventListener('pointerdown',event=>{stage.classList.add('dragging');stage.setPointerCapture?.(event.pointerId);selectFromPointer(event);input.focus({preventScroll:true})});
    stage.addEventListener('pointermove',event=>{if(stage.classList.contains('dragging'))selectFromPointer(event)});
    function release(){stage.classList.remove('dragging')}
    stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
    input.addEventListener('input',render);input.addEventListener('change',render);render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
