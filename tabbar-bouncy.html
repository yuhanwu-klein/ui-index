<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tab Bar · Bouncy</title>
<script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  background:#fff;
  font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:60px;
  user-select:none;-webkit-user-select:none;
}

.bar{
  position:relative;
  width:375px;height:88px;
  overflow:visible;
  transform:translateY(16px);opacity:0;
  animation:fadeIn .5s cubic-bezier(.34,1.56,.64,1) .15s forwards;
}
@keyframes fadeIn{to{transform:none;opacity:1}}

.shadow-wrap{
  position:absolute;inset:0;
  filter:drop-shadow(0 2px 20px rgba(0,0,0,.08)) drop-shadow(0 0 1px rgba(0,0,0,.04));
}

.glass{
  position:absolute;inset:0;
  background:#f4f7f8;
  will-change:clip-path;
}

.blob{
  position:absolute;width:50px;height:50px;border-radius:50%;
  background:linear-gradient(165deg,rgba(200,228,232,.6) 0%,rgba(175,215,225,.7) 35%,rgba(155,200,215,.75) 65%,rgba(170,218,228,.55) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:
    0 8px 28px rgba(100,165,180,.2),
    0 2px 6px rgba(0,0,0,.04),
    inset 0 2px 3px rgba(255,255,255,.5),
    inset 0 -3px 6px rgba(90,155,175,.15);
  pointer-events:none;will-change:transform;
  transform:translate(-50%,-50%);
}
.blob::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 140deg,transparent 30%,rgba(200,235,240,.6) 44%,rgba(240,255,255,.85) 50%,rgba(200,235,240,.6) 56%,transparent 70%);
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 1px));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 1px));
}
.blob::after{
  content:'';position:absolute;top:4px;left:14%;right:14%;height:38%;
  border-radius:50%;
  background:linear-gradient(175deg,rgba(255,255,255,.65) 0%,rgba(230,248,250,.25) 55%,transparent);
}

.items{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-around;
  padding:0 8px 12px;
}

.tab{
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  position:relative;z-index:2;
}
.tab svg{
  width:23px;height:23px;
  stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-width:1.7;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),stroke .25s;
}
.tab.off svg{stroke:rgba(100,110,125,.5)}
.tab.on svg{stroke:rgba(35,85,100,.85);stroke-width:2;transform:scale(1.15)}

html.is-preview body{padding:0;align-items:flex-end}
html.is-preview .bar{width:100%;animation:none;transform:none;opacity:1}
</style>
</head>
<body>
<nav class="bar" id="bar">
  <div class="shadow-wrap">
    <div class="glass" id="gl"></div>
  </div>
  <div class="blob" id="bl"></div>
  <div class="items" id="it"></div>
</nav>
<script>
(function(){
  var tabs=[
    {name:'Home',
     svg:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V19a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V9.5"/>'},
    {name:'Explore',
     svg:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/>'},
    {name:'Favorites',
     svg:'<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>'},
    {name:'Alerts',
     svg:'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>'},
    {name:'Profile',
     svg:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>'}
  ];

  var active=0,tabEls=[],centers=[],barW,barH;
  var gl=document.getElementById('gl');
  var bl=document.getElementById('bl');
  var it=document.getElementById('it');

  tabs.forEach(function(t,i){
    var el=document.createElement('div');
    el.className='tab '+(i===active?'on':'off');
    el.innerHTML='<svg viewBox="0 0 24 24">'+t.svg+'</svg>';
    el.addEventListener('click',function(){pick(i)});
    it.appendChild(el);tabEls.push(el);
  });

  /* Spring physics */
  function Spring(val,stiff,damp){
    this.v=val;this.t=val;this.vel=0;this.s=stiff;this.d=damp;
  }
  Spring.prototype.tick=function(dt){
    this.vel+=(-this.s*(this.v-this.t)-this.d*this.vel)*dt;
    this.v+=this.vel*dt;
  };
  Spring.prototype.settled=function(){
    return Math.abs(this.v-this.t)<.25&&Math.abs(this.vel)<.2;
  };

  var spX,spSc,raf=0;

  function measure(){
    var br=document.getElementById('bar').getBoundingClientRect();
    barW=br.width;barH=br.height;
    centers=tabEls.map(function(el){
      var r=el.getBoundingClientRect();
      return r.left-br.left+r.width/2;
    });
  }

  /* Morphing bar shape with rounded bottom corners */
  function barPath(cx){
    var base=24,amp=20,sig=38,n=80,R=24;
    var d='M '+R+' '+barH;
    d+=' Q 0 '+barH+' 0 '+(barH-R);
    d+=' L0 '+base;
    for(var i=0;i<=n;i++){
      var x=i/n*barW;
      var norm=(x-cx)/sig;
      var g=Math.exp(-norm*norm/2);
      var y=base-amp*g+amp*.18*norm*norm*g;
      d+=' L'+x.toFixed(1)+' '+Math.max(1,y).toFixed(1);
    }
    d+=' L'+barW+' '+(barH-R);
    d+=' Q '+barW+' '+barH+' '+(barW-R)+' '+barH;
    d+=' Z';
    return d;
  }

  function render(){
    gl.style.clipPath="path('"+barPath(spX.v)+"')";
    var blobY=(88-12)/2;
    bl.style.left=spX.v+'px';
    bl.style.top=blobY+'px';
    bl.style.transform='translate(-50%,-50%) scale('+spSc.v.toFixed(3)+')';
  }

  function animate(){
    var last=performance.now();
    function step(now){
      var dt=Math.min((now-last)/1e3,.033);last=now;
      spX.tick(dt);spSc.tick(dt);
      render();
      if(spX.settled()&&spSc.settled()){
        spX.v=spX.t;spSc.v=spSc.t;render();raf=0;return;
      }
      raf=requestAnimationFrame(step);
    }
    if(!raf)raf=requestAnimationFrame(step);
  }

  function pick(i){
    if(i===active)return;
    tabEls[active].className='tab off';
    active=i;
    tabEls[active].className='tab on';
    spX.t=centers[i];
    spSc.v=.8;spSc.t=1;spSc.vel=0;
    animate();
  }

  window.addEventListener('resize',function(){
    measure();if(spX){spX.v=spX.t=centers[active]}render();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'&&active>0)pick(active-1);
    if(e.key==='ArrowRight'&&active<tabs.length-1)pick(active+1);
  });

  requestAnimationFrame(function(){
    measure();
    spX=new Spring(centers[active],180,12);
    spSc=new Spring(1,300,20);
    render();
  });
})();
</script>
</body>
</html>
