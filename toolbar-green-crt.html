<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Toolbar · Playful</title>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#fff;font-family:'Silkscreen',monospace}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .frame{
      width:560px;max-width:85vw;aspect-ratio:4/3;
      display:flex;align-items:center;justify-content:center;
    }

    .bar{
      display:flex;align-items:center;gap:2px;
      background:#fff;
      border-radius:18px;
      padding:6px;
      box-shadow:0 2px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
    }

    .tool{
      width:48px;height:48px;
      border:none;background:transparent;
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:#444;position:relative;
      transition:color .2s,background .25s,transform .15s;
    }
    .tool svg{
      width:22px;height:22px;
      shape-rendering:crispEdges;
      transition:transform .15s;
    }
    .tool.on{
      background:var(--h,#eee);
      color:#fff;
      transform:scale(1);
    }
    .tool:not(.on):hover{
      color:var(--h,#000);
      background:color-mix(in srgb,var(--h,#000) 10%,transparent);
    }
    .tool:hover svg{animation:var(--a,pop) .35s ease}

    .tool .label{
      position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
      font:9px/1 'Silkscreen',monospace;color:#999;
      white-space:nowrap;opacity:0;transition:opacity .15s;
      pointer-events:none;
    }
    .tool:hover .label{opacity:1}

    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
    @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-4deg)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
    @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
    @keyframes pour{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-25deg) translateY(-2px)}}
    @keyframes stamp{0%{transform:scale(1)}30%{transform:scale(1.15)}50%{transform:scale(.9)}100%{transform:scale(1)}}

    html.is-preview .frame{aspect-ratio:auto;width:100%;height:100%}
  </style>
</head>
<body>
<div class="frame">
  <div class="bar" id="bar">
    <button class="tool on" data-icon="pencil" style="--h:#e67e22;--a:tilt" data-name="Pencil"></button>
    <button class="tool" data-icon="eraser" style="--h:#e74c8c;--a:shake" data-name="Eraser"></button>
    <button class="tool" data-icon="brush" style="--h:#e74c3c;--a:wiggle" data-name="Brush"></button>
    <button class="tool" data-icon="bucket" style="--h:#f39c12;--a:pour" data-name="Fill"></button>
    <button class="tool" data-icon="dropper" style="--h:#27ae60;--a:bounce" data-name="Dropper"></button>
    <button class="tool" data-icon="select" style="--h:#9b59b6;--a:pop" data-name="Select"></button>
    <button class="tool" data-icon="line" style="--h:#1abc9c;--a:tilt" data-name="Line"></button>
    <button class="tool" data-icon="rect" style="--h:#3498db;--a:pop" data-name="Rect"></button>
    <button class="tool" data-icon="oval" style="--h:#e91e63;--a:pop" data-name="Oval"></button>
    <button class="tool" data-icon="text_a" style="--h:#5b5ea6;--a:stamp" data-name="Text"></button>
    <button class="tool" data-icon="spray" style="--h:#ff6b6b;--a:shake" data-name="Spray"></button>
    <button class="tool" data-icon="pointer" style="--h:#4a90d9;--a:pop" data-name="Move"></button>
  </div>
</div>

<script>
(function(){
  var icons={
    pointer:'X/XX/XXX/XXXX/XXXXX/XXXXXX/XXXXXXX/XXXX/X.XX/..XX/...X',
    select:'X.X.X.X/......./X.....X/......./X.....X/......./X.X.X.X',
    pencil:'........X/.......XX/......XX./....XXX../...XX..../..XX...../XX......./X........',
    eraser:'.....XXX/....XXXX/...XXXX./..XXXX../XXXXX.../XXXX..../XXX.....',
    bucket:'..X./..XX/.XXXXX/X....X/X....X/X....X/.XXXX.',
    dropper:'......XX/.....X.X/....X.X/...X.X/..X.X/.XX./XX..',
    text_a:'..XXX./.X...X/X.....X/X.....X/XXXXXXX/X.....X/X.....X',
    brush:'......XX/.....X.X/...XX..X/..X..XX./.X..X../XXXX.../X..X.../XXXX...',
    line:'.......X/......X./.....X./....X./...X../..X../X.....',
    spray:'X.X.X/.X.X./X.X.X/.X.X./X.X.X/.X.X.',
    rect:'XXXXXXX/X.....X/X.....X/X.....X/X.....X/X.....X/XXXXXXX',
    oval:'..XXX./.X...X/X.....X/X.....X/X.....X/.X...X/..XXX.'
  };

  var ns='http://www.w3.org/2000/svg';
  document.querySelectorAll('.tool[data-icon]').forEach(function(el){
    var data=icons[el.dataset.icon];
    if(!data)return;
    var rows=data.split('/');
    var h=rows.length;
    var w=Math.max.apply(null,rows.map(function(r){return r.length}));
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+(w+2)+' '+(h+2));
    svg.setAttribute('shape-rendering','crispEdges');
    var d='';
    rows.forEach(function(row,y){
      var x=0;
      while(x<row.length){
        if(row[x]==='X'){
          var s=x;
          while(x<row.length&&row[x]==='X')x++;
          d+='M'+(s+1)+' '+(y+1)+'h'+(x-s)+'v1h-'+(x-s)+'z';
        }else x++;
      }
    });
    var p=document.createElementNS(ns,'path');
    p.setAttribute('d',d);
    p.setAttribute('fill','currentColor');
    svg.appendChild(p);

    var lbl=document.createElement('span');
    lbl.className='label';
    lbl.textContent=el.dataset.name;
    el.appendChild(svg);
    el.appendChild(lbl);
  });

  document.querySelectorAll('.tool').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.tool').forEach(function(b){b.classList.remove('on')});
      btn.classList.add('on');
    });
  });
})();
</script>
<script src="design-specs.js"></script>
</body>
</html>
