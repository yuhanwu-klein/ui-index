<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Toolbar · Playful</title>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#fff;font-family:'Silkscreen',monospace}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .frame{
      width:560px;max-width:85vw;aspect-ratio:4/3;
      display:flex;align-items:center;justify-content:center;
    }

    .bar{
      display:flex;align-items:center;gap:6px;
      background:#fff;
      border-radius:24px;
      padding:8px 14px;
      box-shadow:0 2px 16px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
    }

    .tool{
      width:60px;height:60px;
      border:none;background:transparent;
      border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;position:relative;
      transition:background .2s,transform .12s;
    }
    .tool svg{
      width:32px;height:32px;
      shape-rendering:crispEdges;
    }
    .tool rect{
      fill:#2a2a2a;
      transition:fill .3s ease;
    }
    .tool:hover{background:rgba(0,0,0,.03)}
    .tool.on{background:rgba(0,0,0,.05)}
    .tool:active{transform:scale(.9)}
    .tool:hover svg{animation:var(--a,pop) .4s ease}

    .tool .label{
      position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
      font:9px/1 'Silkscreen',monospace;color:#bbb;
      white-space:nowrap;opacity:0;transition:opacity .15s;
      pointer-events:none;
    }
    .tool:hover .label{opacity:1}

    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
    @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
    @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
    @keyframes pour{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-28deg) translateY(-2px)}}

    html.is-preview .frame{aspect-ratio:auto;width:100%;height:100%}
  </style>
</head>
<body>
<div class="frame">
  <div class="bar">
    <button class="tool on" data-icon="pencil" style="--a:tilt" data-name="Pencil"></button>
    <button class="tool" data-icon="eraser" style="--a:shake" data-name="Eraser"></button>
    <button class="tool" data-icon="lasso" style="--a:pop" data-name="Lasso"></button>
    <button class="tool" data-icon="bucket" style="--a:pour" data-name="Fill"></button>
    <button class="tool" data-icon="text_a" style="--a:bounce" data-name="Text"></button>
    <button class="tool" data-icon="brush" style="--a:wiggle" data-name="Brush"></button>
  </div>
</div>

<script>
(function(){
  var icons={
    pencil:'....X..../...X.X.../...XXX.../..XXXXX../.X.....X./.X.X.X.X./.X.....X./.X..X..X./.X.....X./.XXXXXXX./.XXXXXXX./..XXXXX.../...XXX...',
    eraser:'.XXXXXXX./.X.....X./.X.X.X.X./.X.....X./.X..X..X./.X.....X./.XXXXXXX./..XXXXX..',
    lasso:'...XXX.../..X...X../.X.....X./X..X.X..X/X.......X/X...X...X/.X.....X./..X...X../...XXX...',
    bucket:'..X....../..XX...../.XXXXXXX./.X.....X./.X.X.X.X./.X.....X./.X..X..X./.X.....X./..XXXXX.../...XXX...',
    text_a:'...XXX.../..X...X../.X.....X./.X.X.X.X./.XXXXXXX./.X.....X./.X..X..X./.X.....X./.X.....X.',
    brush:'....X..../...XXX.../..XXXXX../.X.....X./.X.X.X.X./.X.....X./.X..X..X./.XXXXXXX./....X..../....X..../....X..../....X..../...XXX...'
  };

  var ns='http://www.w3.org/2000/svg';

  document.querySelectorAll('.tool[data-icon]').forEach(function(el){
    var data=icons[el.dataset.icon];
    if(!data)return;
    var rows=data.split('/');
    var h=rows.length;
    var w=Math.max.apply(null,rows.map(function(r){return r.length}));
    var svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 '+(w+2)+' '+(h+2));
    svg.setAttribute('shape-rendering','crispEdges');

    var pxs=[];
    rows.forEach(function(row,y){
      for(var x=0;x<row.length;x++){
        if(row[x]==='X'){
          var r=document.createElementNS(ns,'rect');
          r.setAttribute('x',x+1);
          r.setAttribute('y',y+1);
          r.setAttribute('width',1);
          r.setAttribute('height',1);
          var d=x+y;
          r._d=d;
          svg.appendChild(r);
          pxs.push(r);
        }
      }
    });

    el._pxs=pxs;
    el._maxD=Math.max.apply(null,pxs.map(function(r){return r._d}))||1;

    var lbl=document.createElement('span');
    lbl.className='label';
    lbl.textContent=el.dataset.name;
    el.appendChild(svg);
    el.appendChild(lbl);
  });

  function rainbow(el){
    if(!el._pxs)return;
    var m=el._maxD;
    el._pxs.forEach(function(r){
      var t=r._d/m;
      var hue=Math.round(t*320);
      r.style.fill='hsl('+hue+',78%,62%)';
      r.style.transitionDelay=(r._d*18)+'ms';
    });
  }

  function gray(el){
    if(!el._pxs)return;
    el._pxs.forEach(function(r){
      r.style.fill='';
      r.style.transitionDelay=(r._d*12)+'ms';
    });
  }

  document.querySelectorAll('.tool').forEach(function(btn){
    btn.addEventListener('mouseenter',function(){
      if(!btn.classList.contains('on'))rainbow(btn);
    });
    btn.addEventListener('mouseleave',function(){
      if(!btn.classList.contains('on'))gray(btn);
    });
    btn.addEventListener('click',function(){
      document.querySelectorAll('.tool').forEach(function(b){
        b.classList.remove('on');gray(b);
      });
      btn.classList.add('on');
      rainbow(btn);
    });
  });

  var cur=document.querySelector('.tool.on');
  if(cur)rainbow(cur);
})();
</script>
<script src="design-specs.js"></script>
</body>
</html>
