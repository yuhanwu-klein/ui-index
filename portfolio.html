<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Our Team</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#fff;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#222}
    body{display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}

    .frame{
      width:680px;max-width:96vw;
      display:flex;flex-direction:column;align-items:center;
    }

    h1{font-size:32px;font-weight:800;letter-spacing:-.04em;text-align:center}
    .sub{font-size:14px;color:#717171;text-align:center;margin-top:6px}

    .stage{
      width:100%;height:360px;
      position:relative;
      perspective:1200px;
      margin-top:28px;
    }

    .card{
      position:absolute;left:50%;top:50%;
      width:140px;height:210px;
      transform-origin:center center;
      transition:all .65s cubic-bezier(.22,1,.36,1);
      cursor:pointer;
      will-change:transform,opacity;
    }
    .card.active{cursor:default}
    .card .photo{
      width:100%;height:100%;
      overflow:hidden;
    }
    .card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}

    .info-card{
      margin-top:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,.06);
      border-radius:18px;
      box-shadow:none;
      padding:20px 36px 16px;
      text-align:center;
      display:flex;flex-direction:column;align-items:center;gap:4px;
    }
    .d-name{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .d-role{font-size:13px;color:#717171;font-weight:500}

    .prism-wrap{
      perspective:500px;
      height:42px;width:180px;
      margin-top:12px;
      cursor:pointer;
    }
    .prism{
      position:relative;width:100%;height:100%;
      transform-style:preserve-3d;
      transition:transform .55s cubic-bezier(.22,1,.36,1);
    }
    .prism-wrap:hover .prism{transform:rotateX(-93deg)}
    .prism-face{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      backface-visibility:hidden;
      border-radius:999px;
    }
    .prism-front{
      transform:translateZ(21px);
      color:#999;font:500 12px/1 inherit;letter-spacing:.01em;
    }
    .prism-bottom{
      transform:rotateX(90deg) translateZ(21px);
      background:#222;
    }
    .prism-bottom a{
      color:#fff;font:600 13px/1 inherit;letter-spacing:.01em;
      text-decoration:none;display:flex;align-items:center;justify-content:center;
      width:100%;height:100%;border-radius:999px;
    }
    .prism-bottom a:active{transform:scale(.94)}


    html.is-preview .frame{width:100%;max-width:680px}
  </style>
</head>
<body>
<div class="frame">

  <h1>Meet Our Team</h1>
  <p class="sub">Creative minds behind the work.</p>

  <div class="stage" id="stage"></div>

  <div class="info-card">
    <div class="d-name" id="d-name"></div>
    <div class="d-role" id="d-role"></div>
    <div class="prism-wrap">
      <div class="prism" id="d-prism">
        <div class="prism-face prism-front" id="d-link-text"></div>
        <div class="prism-face prism-bottom">
          <a id="d-btn" href="#" target="_blank" rel="noopener">View Web</a>
        </div>
      </div>
    </div>
  </div>


</div>

<script>
(function(){
  var designers=[
    {name:'Ravi Kapoor',role:'Product Designer',url:'https://ravikapoor.design',img:'person-1.png'},
    {name:'Jaylen Moore',role:'UX Engineer',url:'https://jaylenmoore.co',img:'person-2.png'},
    {name:'Mei Lin',role:'Visual Designer',url:'https://meilin.studio',img:'person-3.png'},
    {name:'Clara Schulz',role:'Brand Designer',url:'https://claraschulz.com',img:'person-4.png'},
    {name:'Sora Park',role:'Art Director',url:'https://sorapark.art',img:'person-5.png'}
  ];

  var stage=document.getElementById('stage');
  var cards=[];
  var active=0;
  var n=designers.length;
  var ARC_R=420;
  var ARC_ANGLE=22;

  designers.forEach(function(d,i){
    var card=document.createElement('div');
    card.className='card';
    var photo=document.createElement('div');
    photo.className='photo';
    var img=document.createElement('img');
    img.src=d.img;img.alt=d.name;img.draggable=false;
    photo.appendChild(img);
    card.appendChild(photo);
    card.addEventListener('click',function(){if(i!==active){active=i;layout()}});
    stage.appendChild(card);
    cards.push(card);
  });


  function layout(){
    cards.forEach(function(card,i){
      var offset=i-active;
      if(offset>Math.floor(n/2))offset-=n;
      if(offset<-Math.floor(n/2))offset+=n;

      var absOff=Math.abs(offset);
      var angle=offset*ARC_ANGLE*Math.PI/180;
      var x=ARC_R*Math.sin(angle);
      var y=ARC_R*(1-Math.cos(angle));
      var s=Math.max(.55,1-absOff*.14);
      var o=absOff>2?0:Math.max(.15,1-absOff*.35);
      var ry=-offset*12;

      card.style.transform='translateX(calc(-50% + '+Math.round(x)+'px)) translateY(calc(-50% + '+Math.round(y)+'px)) scale('+s.toFixed(3)+') rotateY('+ry+'deg)';
      card.style.opacity=o.toFixed(2);
      card.style.zIndex=10-absOff;
      card.style.pointerEvents=absOff>2?'none':'auto';
      card.classList.toggle('active',i===active);
    });

    var d=designers[active];
    document.getElementById('d-name').textContent=d.name;
    document.getElementById('d-role').textContent=d.role;
    document.getElementById('d-link-text').textContent=d.url.replace('https://','');
    document.getElementById('d-btn').href=d.url;

  }

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){active=(active-1+n)%n;layout()}
    if(e.key==='ArrowRight'){active=(active+1)%n;layout()}
  });

  layout();
})();
</script>
<script src="design-specs.js?v=18"></script>
</body>
</html>
