<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Color Tuner · Stepped Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--pink:#ff5aa0;--green:#2eb86a;--yellow:#ffe340;--blue:#2d5bff;--ink:#050505;--cream:#f3eac4;--paper:#fffdf5;--color:#5bd65b;--pct:40%;--pixel:"VT323","Space Mono",monospace;--mono:"Space Mono","SF Mono",monospace;--ease:cubic-bezier(.22,1,.32,1);--snap:cubic-bezier(.34,1.56,.64,1)}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:start center;padding:86px 24px 38px;color:var(--ink);font-family:var(--mono);background-color:var(--pink);background-image:linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%),linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%);background-position:0 0,6px 6px;background-size:12px 12px;transition:background-color 520ms var(--ease)}
    body.mode-chroma{background-color:var(--yellow);background-image:linear-gradient(45deg,var(--blue) 25%,transparent 25%,transparent 75%,var(--blue) 75%),linear-gradient(45deg,var(--blue) 25%,transparent 25%,transparent 75%,var(--blue) 75%)}
    html.is-preview body{padding:38px 24px}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.34) 4px)}
    button,input{font:inherit}
    .app{position:relative;z-index:1;width:min(100%,820px)}
    .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
    .eyebrow,.badge,.section-label,.token-key{font-family:var(--pixel);letter-spacing:.18em;text-transform:uppercase}
    .eyebrow{display:inline-block;margin-bottom:7px;padding:3px 10px 2px;border:1.5px solid var(--ink);background:var(--cream);box-shadow:3px 3px 0 var(--ink);font-size:17px}
    h1{margin:0;padding:6px 15px 3px;border:2px solid var(--ink);background:var(--cream);box-shadow:5px 5px 0 var(--ink);font-family:var(--pixel);font-size:clamp(34px,5vw,46px);font-weight:400;line-height:1;letter-spacing:.03em;text-transform:uppercase}
    .badge{flex:0 0 auto;padding:4px 9px 2px;border:1.5px solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink);font-size:14px}
    .workspace{display:grid;grid-template-columns:1fr;justify-items:center;gap:16px;align-items:start}
    .card{border:2px solid var(--ink);background:var(--cream);box-shadow:5px 5px 0 var(--ink)}
    .preview-card{width:min(100%,440px);padding:14px;display:flex;flex-direction:column;gap:10px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .section-label{font-size:16px}.live{padding:2px 7px 1px;border:1.5px solid var(--ink);background:var(--green);font-family:var(--pixel);font-size:13px;letter-spacing:.12em}
    .product{position:relative;min-height:172px;display:flex;flex-direction:column;justify-content:space-between;padding:15px;border:2px solid var(--ink);background:var(--color);box-shadow:4px 4px 0 var(--ink);transition:background 300ms var(--ease),transform 180ms var(--ease)}
    .product::after{content:"";position:absolute;z-index:4;top:18px;right:20px;width:6px;height:6px;background:var(--yellow);opacity:0;box-shadow:-18px 12px 0 var(--pink),8px 30px 0 var(--blue),-30px 42px 0 var(--cream),12px 58px 0 var(--green);pointer-events:none}
    .product:hover{transform:translate(-2px,-2px)}
    .product-copy{max-width:210px}.product-kicker{display:block;margin-bottom:4px;font-family:var(--pixel);font-size:15px;letter-spacing:.12em}.product-title{display:block;font-family:var(--pixel);font-size:34px;line-height:.9;text-transform:uppercase}
    .commerce-button{align-self:flex-start;min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-family:var(--pixel);font-size:19px;letter-spacing:.08em;text-transform:uppercase}
    .token{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:10px 11px;border:1.5px solid var(--ink);background:var(--paper)}
    .token-key{font-size:13px}.token-value{font:700 11px/1.35 var(--mono);text-align:right}
    .control-card{position:relative;overflow:hidden;width:min(100%,640px);padding:14px;display:flex;flex-direction:column;gap:12px}
    .control-card::after{content:"";position:absolute;z-index:20;left:0;right:0;top:-16px;height:12px;border-block:2px solid var(--ink);background:var(--yellow);opacity:0;pointer-events:none}
    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .mode{min-height:44px;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-family:var(--pixel);font-size:20px;letter-spacing:.12em;cursor:pointer;transition:transform 150ms var(--ease),box-shadow 150ms var(--ease),background 150ms steps(2)}
    .mode:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}.mode:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.mode[aria-selected="true"]{background:var(--yellow)}.mode:focus-visible,.slider:focus-visible,.copy:focus-visible{outline:4px solid var(--blue);outline-offset:4px}
    .range-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.range-name{font-family:var(--pixel);font-size:17px;letter-spacing:.1em}.range-value{font-family:var(--pixel);font-size:34px;line-height:.8}
    .range-wrap{position:relative;height:84px}
    .track{position:absolute;inset:10px 0;border:2px solid var(--ink);border-radius:14px;background:var(--track-bg);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
    .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,253,245,.16) 6px 12px);pointer-events:none}
    .fill,.remain{display:none}
    .divider{position:absolute;z-index:3;top:50%;left:var(--pct);width:14px;height:66px;transform:translate(-50%,-50%);pointer-events:none;transition:left 80ms linear}.divider::before{content:"";position:absolute;left:4px;inset-block:0;width:6px;border:1.5px solid var(--ink);background:var(--paper);box-shadow:2px 2px 0 var(--ink)}.divider::after{content:"";position:absolute;left:0;top:50%;width:14px;height:14px;border:1.5px solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink);transform:translateY(-50%) rotate(45deg);transition:transform 160ms var(--snap),background 160ms steps(2)}
    .slider{position:absolute;z-index:5;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab}.slider:active{cursor:grabbing}
    .range-wrap:hover .divider::after{transform:translateY(-50%) rotate(45deg) scale(1.12)}.range-wrap.pressed .divider::after{background:var(--blue);transform:translateY(-50%) rotate(45deg) scale(.92)}.range-wrap.dragging .divider::after{animation:pulse 360ms steps(2) infinite}.range-wrap.settling .divider{animation:snap 360ms var(--snap)}
    .steps{display:flex;justify-content:space-between;padding:0 8px}.step{width:8px;height:8px;border:1.5px solid var(--ink);background:var(--paper);box-shadow:1.5px 1.5px 0 var(--ink)}.step.on{background:var(--yellow);transform:translateY(-2px) scale(1.2)}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{padding:7px;border:1.5px solid var(--ink);background:var(--paper)}.metric b{display:block;margin-bottom:3px;font-family:var(--pixel);font-size:13px;letter-spacing:.12em}.metric span{display:block;font-size:11px;font-weight:700}
    .copy{min-height:44px;border:2px solid var(--ink);background:var(--pink);box-shadow:3px 3px 0 var(--ink);font-family:var(--pixel);font-size:19px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.copy:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}.copy:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
    .app.updating .range-value{animation:rgb-split 320ms steps(2)}.app.updating .step.on{animation:tick-pop 360ms var(--snap)}.app.updating .product{animation:card-glitch 340ms steps(2)}.app.updating .product::after{animation:pixel-burst 480ms steps(4)}.app.updating .product-title{animation:rgb-split 340ms steps(2)}.control-card.mode-changing::after{animation:scan-sweep 520ms steps(6)}.control-card.mode-changing .mode[aria-selected="true"]{animation:mode-pop 420ms var(--snap)}
    @keyframes pulse{50%{background:var(--blue);transform:translateY(-50%) rotate(45deg) scale(1.18)}}
    @keyframes snap{45%{transform:translate(-50%,-50%) scaleX(1.4) scaleY(.86)}}
    @keyframes rgb-split{0%,100%{text-shadow:0 0 0 transparent;transform:translate(0)}25%{text-shadow:-3px 0 var(--pink),3px 0 var(--blue);transform:translate(-1px,1px)}50%{text-shadow:3px 0 var(--green),-3px 0 var(--yellow);transform:translate(2px,-1px)}75%{text-shadow:-2px 0 var(--blue),2px 0 var(--pink);transform:translate(-1px)}}
    @keyframes card-glitch{0%,100%{transform:translate(0);filter:none}25%{transform:translate(-3px,1px);filter:saturate(1.45)}50%{transform:translate(3px,-1px);filter:hue-rotate(18deg)}75%{transform:translate(-1px,2px);filter:saturate(.8)}}
    @keyframes pixel-burst{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(18px,-22px) scale(1.5)}}
    @keyframes tick-pop{50%{transform:translateY(-5px) scale(1.65);background:var(--blue)}}
    @keyframes scan-sweep{0%{top:-16px;opacity:0}15%,80%{opacity:1}100%{top:calc(100% + 16px);opacity:0}}
    @keyframes mode-pop{45%{transform:translate(-3px,-3px) scale(1.035);box-shadow:7px 7px 0 var(--ink)}}
    @media(max-width:760px){body{place-items:start center;padding:78px 16px 26px}html.is-preview body{padding:26px 16px}.mast{align-items:flex-start}.product{min-height:168px}}
    @media(max-width:460px){.mast{display:block}.badge{display:inline-block;margin-top:11px}.workspace{gap:13px}.card{box-shadow:4px 4px 0 var(--ink)}.product{min-height:162px}.metrics{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric b{margin:0}.range-value{font-size:32px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="mast"><div><span class="eyebrow">Palette_Studio.exe</span><h1>Brand Color Tuner</h1></div><span class="badge">6-Step Control</span></header>
    <div class="workspace">
      <section class="card preview-card" aria-label="Commerce color preview">
        <div class="card-head"><span class="section-label">Live Preview</span><span class="live">ACTIVE</span></div>
        <div class="product" id="product"><div class="product-copy"><span class="product-kicker">SUMMER DROP / 04</span><strong class="product-title">Color that converts.</strong></div><button class="commerce-button" type="button">Add to cart ↗</button></div>
        <div class="token"><span class="token-key">Token</span><span class="token-value">--brand-primary</span><span class="token-key">Usage</span><span class="token-value">CTA / Promo</span></div>
      </section>
      <section class="card control-card" aria-label="Brand color controls">
        <div class="card-head"><span class="section-label">Color Parameter</span><span class="live" id="status">HUE MODE</span></div>
        <div class="mode-tabs" role="tablist" aria-label="Color parameter">
          <button class="mode" id="hueTab" type="button" role="tab" aria-selected="true">HUE</button>
          <button class="mode" id="chromaTab" type="button" role="tab" aria-selected="false">CHROMA</button>
        </div>
        <div class="range-head"><span class="range-name" id="rangeName">HUE ANGLE</span><output class="range-value" id="rangeValue" for="level">120°</output></div>
        <div class="range-wrap" id="rangeWrap">
          <div class="track" aria-hidden="true"><span class="fill"></span><span class="remain"></span><span class="divider"></span></div>
          <input class="slider" id="level" type="range" min="0" max="5" step="1" value="2" aria-label="Hue angle" aria-valuetext="Hue 120 degrees, step 3 of 6">
        </div>
        <div class="steps" aria-hidden="true"><span class="step"></span><span class="step"></span><span class="step on"></span><span class="step"></span><span class="step"></span><span class="step"></span></div>
        <div class="metrics" aria-live="polite"><div class="metric"><b>HUE</b><span id="hueMetric">120°</span></div><div class="metric"><b>CHROMA</b><span id="chromaMetric">60%</span></div><div class="metric"><b>HEX</b><span id="hexMetric">#5BD65B</span></div></div>
        <button class="copy" id="copy" type="button">Copy CSS Token</button>
      </section>
    </div>
  </main>
  <script>
    const root=document.documentElement,app=document.querySelector('.app'),controlCard=document.querySelector('.control-card'),input=document.getElementById('level'),wrap=document.getElementById('rangeWrap'),rangeName=document.getElementById('rangeName'),rangeValue=document.getElementById('rangeValue'),hueMetric=document.getElementById('hueMetric'),chromaMetric=document.getElementById('chromaMetric'),hexMetric=document.getElementById('hexMetric'),status=document.getElementById('status'),copy=document.getElementById('copy'),tabs={hue:document.getElementById('hueTab'),chroma:document.getElementById('chromaTab')},steps=[...document.querySelectorAll('.step')];
    const state={mode:'hue',hueStep:2,chromaStep:3};let settleTimer,motionTimer,modeTimer;
    function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return`#${[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}`}
    function animateUpdate(){app.classList.remove('updating');requestAnimationFrame(()=>app.classList.add('updating'));status.textContent='SYNCING';clearTimeout(motionTimer);motionTimer=setTimeout(()=>{app.classList.remove('updating');status.textContent=`${state.mode.toUpperCase()} MODE`},500)}
    function render(animate=false){const step=Number(input.value);state[state.mode+'Step']=step;const hue=state.hueStep*60,chroma=state.chromaStep*20,pct=step*20,hex=hslToHex(hue,chroma,60),muted=hslToHex(hue,0,60),saturated=hslToHex(hue,100,60);root.style.setProperty('--pct',`${pct}%`);root.style.setProperty('--color',hex);root.style.setProperty('--track-bg',state.mode==='hue'?'linear-gradient(90deg,#ff3948,#ffca28,#26d86f,#2ac8ff,#4f48ff,#d53cff,#ff3948)':`linear-gradient(90deg,${muted},${saturated})`);rangeName.textContent=state.mode==='hue'?'HUE ANGLE':'CHROMA LEVEL';rangeValue.textContent=state.mode==='hue'?`${hue}°`:`${chroma}%`;hueMetric.textContent=`${hue}°`;chromaMetric.textContent=`${chroma}%`;hexMetric.textContent=hex;status.textContent=`${state.mode.toUpperCase()} MODE`;input.setAttribute('aria-label',state.mode==='hue'?'Hue angle':'Chroma level');input.setAttribute('aria-valuetext',state.mode==='hue'?`Hue ${hue} degrees, step ${step+1} of 6`:`Chroma ${chroma} percent, step ${step+1} of 6`);steps.forEach((dot,index)=>dot.classList.toggle('on',index===step));if(animate)animateUpdate()}
    function selectMode(mode){state.mode=mode;input.value=state[mode+'Step'];document.body.classList.toggle('mode-chroma',mode==='chroma');Object.entries(tabs).forEach(([name,tab])=>tab.setAttribute('aria-selected',String(name===mode)));controlCard.classList.remove('mode-changing');requestAnimationFrame(()=>controlCard.classList.add('mode-changing'));clearTimeout(modeTimer);modeTimer=setTimeout(()=>controlCard.classList.remove('mode-changing'),560);render(true)}
    function settle(){wrap.classList.remove('pressed','dragging','settling');requestAnimationFrame(()=>wrap.classList.add('settling'));clearTimeout(settleTimer);settleTimer=setTimeout(()=>wrap.classList.remove('settling'),380)}
    tabs.hue.addEventListener('click',()=>selectMode('hue'));tabs.chroma.addEventListener('click',()=>selectMode('chroma'));input.addEventListener('input',()=>render(true));input.addEventListener('pointerdown',event=>{wrap.classList.add('pressed','dragging');input.setPointerCapture?.(event.pointerId)});input.addEventListener('pointerup',settle);input.addEventListener('pointercancel',settle);input.addEventListener('change',settle);input.addEventListener('keydown',()=>wrap.classList.add('pressed'));input.addEventListener('keyup',settle);copy.addEventListener('click',async()=>{const text=`--brand-primary: ${hexMetric.textContent};`;try{await navigator.clipboard.writeText(text);copy.textContent='Copied: '+text}catch{copy.textContent=text}setTimeout(()=>copy.textContent='Copy CSS Token',1600)});render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
