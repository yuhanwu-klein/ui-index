<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hue / Chroma · Stepped Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    :root{--pink:#ff5aa0;--green:#2eb86a;--yellow:#ffe340;--blue:#2d5bff;--ink:#050505;--cream:#f3eac4;--step:40%;--pixel:"VT323","Space Mono",monospace;--mono:"Space Mono","SF Mono",monospace;--ease:cubic-bezier(.22,1,.32,1);--snap:cubic-bezier(.34,1.56,.64,1);}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;}
    body{display:grid;place-items:center;color:var(--ink);font-family:var(--mono);background-color:var(--pink);background-image:linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%),linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%);background-position:0 0,6px 6px;background-size:12px 12px;}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.3) 4px);}
    .stage{width:min(92vw,760px);display:flex;flex-direction:column;align-items:center;gap:32px;padding:44px 24px;position:relative;z-index:1;}
    .tag,.title,.readout,.hint{background:var(--cream);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);}
    .tag{padding:5px 18px 3px;font-family:var(--pixel);font-size:25px;line-height:1;letter-spacing:.24em;text-transform:uppercase;}
    .title{margin:0;padding:8px 22px 5px;font-family:var(--pixel);font-size:clamp(42px,7vw,64px);line-height:1;letter-spacing:.04em;text-align:center;text-transform:uppercase;}
    .mixer{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px;}
    .slider-wrap{position:relative;width:100%;height:176px;}
    .shell{position:absolute;inset:0;overflow:hidden;border:4px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:10px 10px 0 var(--ink);transition:transform 160ms var(--ease),box-shadow 160ms var(--ease);}
    .zone{position:absolute;top:0;bottom:0;overflow:hidden;transition:width 80ms linear;}
    .zone.left{left:0;width:var(--step);background-color:var(--pink);background-image:linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%),linear-gradient(45deg,var(--green) 25%,transparent 25%,transparent 75%,var(--green) 75%);background-position:0 0,5px 5px;background-size:10px 10px;}
    .zone.right{right:0;width:calc(100% - var(--step));background:linear-gradient(90deg,#ff3948,#ffca28,#26d86f,#2ac8ff,#4f48ff,#d53cff,#ff3948);}
    .zone.right::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(243,234,196,.32) 5px 10px);}
    .zone-copy{position:absolute;top:50%;z-index:2;display:flex;flex-direction:column;gap:4px;padding:7px 12px 4px;border:2px solid var(--ink);background:var(--cream);box-shadow:4px 4px 0 var(--ink);transform:translateY(-50%);white-space:nowrap;pointer-events:none;transition:opacity 120ms ease,transform 180ms var(--ease);}
    .zone.left .zone-copy{left:24px}.zone.right .zone-copy{right:24px;text-align:right}
    .zone-name{font-family:var(--pixel);font-size:18px;line-height:1;letter-spacing:.18em}.zone-value{font-family:var(--pixel);font-size:34px;line-height:.9}
    .divider{position:absolute;z-index:5;top:50%;left:var(--step);width:24px;height:128px;transform:translate(-50%,-50%);pointer-events:none;transition:left 80ms linear,filter 160ms ease;}
    .divider::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:6px;border:2px solid var(--ink);background:var(--cream);box-shadow:3px 3px 0 var(--ink);}
    .grip{position:absolute;left:0;top:50%;width:24px;height:24px;border:3px solid var(--ink);background:var(--yellow);box-shadow:3px 3px 0 var(--ink);transform:translateY(-50%) rotate(45deg);}
    input[type="range"]{position:absolute;z-index:10;inset:-14px 0;width:100%;height:calc(100% + 28px);margin:0;opacity:0;cursor:grab;}input[type="range"]:active{cursor:grabbing;}
    .slider-wrap:hover .shell{transform:translate(-3px,-3px);box-shadow:13px 13px 0 var(--ink)}
    .slider-wrap.is-pressed .shell{transform:translate(4px,4px);box-shadow:6px 6px 0 var(--ink)}
    .slider-wrap.is-dragging .shell{transform:translate(2px,2px) scaleY(.97);box-shadow:7px 7px 0 var(--ink)}
    .slider-wrap.is-dragging .divider{filter:drop-shadow(0 0 8px var(--yellow))}.slider-wrap.is-dragging .grip{animation:grip-pulse 360ms steps(2) infinite}.slider-wrap.is-dragging .zone-copy{transform:translateY(-50%) translateY(-5px)}.slider-wrap.is-settling .divider{animation:snap 360ms var(--snap)}
    input[type="range"]:focus-visible + .focus-ring{position:absolute;z-index:11;inset:-9px;border:4px solid var(--blue);border-radius:999px;pointer-events:none;}
    .ticks{width:calc(100% - 52px);display:flex;justify-content:space-between;margin-top:-7px}.tick{width:11px;height:11px;border:2px solid var(--ink);background:var(--cream);box-shadow:2px 2px 0 var(--ink);transition:background 180ms steps(2),transform 180ms var(--snap)}.tick.on{background:var(--yellow);transform:translateY(-2px) scale(1.25)}
    .feedback{display:flex;flex-direction:column;align-items:center;gap:11px}.readout{min-width:280px;padding:7px 20px 4px;font-family:var(--pixel);font-size:38px;line-height:1;letter-spacing:.08em;text-align:center;text-transform:uppercase}.hint{padding:5px 14px 3px;background:var(--pink);font-family:var(--pixel);font-size:20px;line-height:1;letter-spacing:.18em;text-transform:uppercase;box-shadow:5px 5px 0 var(--ink)}
    @keyframes grip-pulse{50%{background:var(--blue);transform:translateY(-50%) rotate(45deg) scale(1.16)}}@keyframes snap{45%{transform:translate(-50%,-50%) scaleX(1.35) scaleY(.88)}}
    @media(max-width:620px){.stage{width:min(94vw,520px);gap:24px;padding:28px 18px}.tag{font-size:19px;letter-spacing:.18em}.title{font-size:40px}.slider-wrap{height:142px}.divider{height:104px}.zone.left .zone-copy{left:12px}.zone.right .zone-copy{right:12px}.zone-name{font-size:14px}.zone-value{font-size:27px}.readout{min-width:240px;font-size:32px}}
    @media(max-width:420px){.stage{gap:20px}.slider-wrap{height:126px}.zone-name{font-size:11px;letter-spacing:.08em}.zone-value{font-size:22px}.zone-copy{gap:2px;padding:5px 7px 3px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage">
    <span class="tag">Color_Mixer.exe</span>
    <h1 class="title">Hue or chroma?</h1>
    <section class="mixer" aria-label="Hue and chroma stepped mixer">
      <div class="slider-wrap" id="sliderWrap">
        <div class="shell" aria-hidden="true">
          <div class="zone left"><span class="zone-copy"><span class="zone-name">CHROMA</span><span class="zone-value" id="leftValue">40%</span></span></div>
          <div class="zone right"><span class="zone-copy"><span class="zone-name">HUE</span><span class="zone-value" id="rightValue">60%</span></span></div>
          <span class="divider"><span class="grip"></span></span>
        </div>
        <input id="level" type="range" min="0" max="5" step="1" value="2" aria-label="Hue and chroma balance" aria-valuetext="Chroma 40 percent, hue 60 percent">
        <span class="focus-ring" aria-hidden="true"></span>
      </div>
      <div class="ticks" aria-hidden="true"><span class="tick"></span><span class="tick"></span><span class="tick on"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span></div>
      <div class="feedback" aria-live="polite"><output class="readout" id="readout" for="level">02_HUE_BLEND</output><span class="hint">&gt;&gt; Drag to mix</span></div>
    </section>
  </main>
  <script>
    const input=document.getElementById('level'),wrap=document.getElementById('sliderWrap'),leftValue=document.getElementById('leftValue'),rightValue=document.getElementById('rightValue'),readout=document.getElementById('readout'),ticks=[...document.querySelectorAll('.tick')];
    const names=['00_HUE_ONLY','01_HUE_LEAN','02_HUE_BLEND','03_CHROMA_BLEND','04_CHROMA_LEAN','05_CHROMA_MAX'];let settleTimer;
    function render(){const step=Number(input.value),chroma=step*20;document.documentElement.style.setProperty('--step',`${chroma}%`);leftValue.textContent=`${chroma}%`;rightValue.textContent=`${100-chroma}%`;readout.textContent=names[step];input.setAttribute('aria-valuetext',`Chroma ${chroma} percent, hue ${100-chroma} percent, ${names[step].replaceAll('_',' ')}`);ticks.forEach((tick,index)=>tick.classList.toggle('on',index===step));}
    function settle(){wrap.classList.remove('is-pressed','is-dragging','is-settling');requestAnimationFrame(()=>wrap.classList.add('is-settling'));clearTimeout(settleTimer);settleTimer=setTimeout(()=>wrap.classList.remove('is-settling'),380);}
    input.addEventListener('pointerdown',event=>{wrap.classList.add('is-pressed','is-dragging');input.setPointerCapture?.(event.pointerId)});input.addEventListener('pointerup',settle);input.addEventListener('pointercancel',settle);input.addEventListener('input',render);input.addEventListener('change',settle);input.addEventListener('keydown',()=>wrap.classList.add('is-pressed'));input.addEventListener('keyup',()=>{render();settle()});render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
