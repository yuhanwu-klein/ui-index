    .commerce-button{border-radius:4px;background:var(--line);box-shadow:3px 3px 0 var(--pink)}

    .token{border:1px solid #e4e1d9;border-radius:5px;background:#f5f2eb}
    .token-key{font-family:var(--mono)}
    .control-card{border-color:var(--line);border-radius:14px;box-shadow:5px 5px 0 var(--line)}
    .mode-tabs{border:1px solid #dfddd7;border-radius:6px;background:#eeece6}
    .mode{border-radius:3px;font-family:var(--mono);font-size:10px}
    .mode[aria-selected="true"]{box-shadow:0 0 0 1px var(--line),2px 2px 0 var(--line)}
    .range-name{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .range-value{font-size:24px}
    .track{border-radius:7px;box-shadow:inset 0 0 0 1px var(--line)}
    .track::after{border-radius:7px}
    .divider::before{box-shadow:0 0 0 1px var(--line),2px 2px 0 var(--line)}
    .divider::after{border-radius:1px;background:var(--acid);box-shadow:0 0 0 2px var(--line),2px 2px 0 var(--line)}
    .range-wrap.pressed .divider::after,.range-wrap.dragging .divider::after{background:var(--pink)}
    .steps{align-items:start;padding:0}
    .step{position:relative;width:auto;height:24px;flex:0 0 auto;border-radius:0;background:transparent;color:#85827b;font:600 9px/1 var(--mono);text-align:center}
    .step::before{content:"";display:block;width:6px;height:6px;margin:0 auto 7px;border-radius:1px;background:#c9c6be}
    .step.on{background:transparent;color:var(--ink);transform:none}
    .step.on::before{background:var(--acid);box-shadow:0 0 0 1px var(--line),2px 2px 0 var(--line)}
    .metrics{border-color:#dfddd7}
    .metric+.metric{border-color:#dfddd7}
    .metric b{font-family:var(--mono)}
    .copy{border-radius:4px;background:var(--line);box-shadow:3px 3px 0 var(--pink);font-family:var(--mono);font-size:11px;text-transform:uppercase}
    .copy:hover{background:var(--line);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pink)}
    @media(max-width:520px){.step{font-size:8px}.preview-card,.control-card{border-radius:10px}}
  </style>
  <style>
    body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:72px 24px}
    html.is-preview body{min-height:100vh;min-height:100svh;padding:32px 24px}
    .app{width:min(100%,640px)}
    .app::before{display:none}
    .workspace{display:block}
    design-specs{position:fixed}
    @media(max-width:520px){body{padding:68px 16px 28px}html.is-preview body{padding:24px 16px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="workspace">
      <section class="card control-card" aria-label="Brand color controls">
        <div class="card-head"><span class="section-label">Color Parameter</span><span class="live" id="status">HUE MODE</span></div>
        <div class="mode-tabs" role="tablist" aria-label="Color parameter">
          <button class="mode" id="hueTab" type="button" role="tab" aria-selected="true">HUE</button>
          <button class="mode" id="chromaTab" type="button" role="tab" aria-selected="false">CHROMA</button>
        </div>
        <div class="range-head"><span class="range-name" id="rangeName">HUE ANGLE</span><output class="range-value" id="rangeValue" for="level">120°</output></div>
        <div class="range-wrap" id="rangeWrap">
          <div class="track" aria-hidden="true"><span class="fill"></span><span class="remain"></span><span class="divider"></span></div>
          <input class="slider" id="level" type="range" min="0" max="5" step="1" value="2" aria-label="Hue angle" aria-valuetext="Hue 120 degrees, step 3 of 6">
        </div>
        <div class="steps" aria-hidden="true"><span class="step"></span><span class="step"></span><span class="step on"></span><span class="step"></span><span class="step"></span><span class="step"></span></div>
        <div class="metrics" aria-live="polite"><div class="metric"><b>HUE</b><span id="hueMetric">120°</span></div><div class="metric"><b>CHROMA</b><span id="chromaMetric">60%</span></div><div class="metric"><b>HEX</b><span id="hexMetric">#5BD65B</span></div></div>
        <button class="copy" id="copy" type="button">Copy color value</button>
      </section>
    </div>
  </main>
  <script>
    const root=document.documentElement,app=document.querySelector('.app'),controlCard=document.querySelector('.control-card'),input=document.getElementById('level'),wrap=document.getElementById('rangeWrap'),rangeName=document.getElementById('rangeName'),rangeValue=document.getElementById('rangeValue'),hueMetric=document.getElementById('hueMetric'),chromaMetric=document.getElementById('chromaMetric'),hexMetric=document.getElementById('hexMetric'),status=document.getElementById('status'),copy=document.getElementById('copy'),tabs={hue:document.getElementById('hueTab'),chroma:document.getElementById('chromaTab')},steps=[...document.querySelectorAll('.step')];
    const state={mode:'hue',hueStep:2,chromaStep:3};let settleTimer,motionTimer,modeTimer;
    function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return`#${[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}`}
    function animateUpdate(){app.classList.remove('updating');requestAnimationFrame(()=>app.classList.add('updating'));status.textContent='SYNCING';clearTimeout(motionTimer);motionTimer=setTimeout(()=>{app.classList.remove('updating');status.textContent=`${state.mode.toUpperCase()} MODE`},500)}
    function render(animate=false){const step=Number(input.value);state[state.mode+'Step']=step;const hue=state.hueStep*60,chroma=state.chromaStep*20,pct=step*20,hex=hslToHex(hue,chroma,60),muted=hslToHex(hue,0,60),saturated=hslToHex(hue,100,60);root.style.setProperty('--pct',`${pct}%`);root.style.setProperty('--color',hex);root.style.setProperty('--track-bg',state.mode==='hue'?'linear-gradient(90deg,#ff3948,#ffca28,#26d86f,#2ac8ff,#4f48ff,#d53cff,#ff3948)':`linear-gradient(90deg,${muted},${saturated})`);rangeName.textContent=state.mode==='hue'?'HUE ANGLE':'CHROMA LEVEL';rangeValue.textContent=state.mode==='hue'?`${hue}°`:`${chroma}%`;hueMetric.textContent=`${hue}°`;chromaMetric.textContent=`${chroma}%`;hexMetric.textContent=hex;status.textContent=`${state.mode.toUpperCase()} MODE`;input.setAttribute('aria-label',state.mode==='hue'?'Hue angle':'Chroma level');input.setAttribute('aria-valuetext',state.mode==='hue'?`Hue ${hue} degrees, step ${step+1} of 6`:`Chroma ${chroma} percent, step ${step+1} of 6`);steps.forEach((dot,index)=>{dot.classList.toggle('on',index===step);dot.textContent=state.mode==='hue'?`${index*60}°`:`${index*20}%`});if(animate)animateUpdate()}
    function selectMode(mode){state.mode=mode;input.value=state[mode+'Step'];document.body.classList.toggle('mode-chroma',mode==='chroma');Object.entries(tabs).forEach(([name,tab])=>tab.setAttribute('aria-selected',String(name===mode)));controlCard.classList.remove('mode-changing');requestAnimationFrame(()=>controlCard.classList.add('mode-changing'));clearTimeout(modeTimer);modeTimer=setTimeout(()=>controlCard.classList.remove('mode-changing'),560);render(true)}
    function settle(){wrap.classList.remove('pressed','dragging','settling');requestAnimationFrame(()=>wrap.classList.add('settling'));clearTimeout(settleTimer);settleTimer=setTimeout(()=>wrap.classList.remove('settling'),380)}
    tabs.hue.addEventListener('click',()=>selectMode('hue'));tabs.chroma.addEventListener('click',()=>selectMode('chroma'));input.addEventListener('input',()=>render(true));input.addEventListener('pointerdown',event=>{wrap.classList.add('pressed','dragging');input.setPointerCapture?.(event.pointerId)});input.addEventListener('pointerup',settle);input.addEventListener('pointercancel',settle);input.addEventListener('change',settle);input.addEventListener('keydown',()=>wrap.classList.add('pressed'));input.addEventListener('keyup',settle);copy.addEventListener('click',async()=>{const text=`--brand-primary: ${hexMetric.textContent};`;try{await navigator.clipboard.writeText(text);copy.textContent='Copied · '+hexMetric.textContent}catch{copy.textContent=hexMetric.textContent}setTimeout(()=>copy.textContent='Copy color value',1600)});render();
  </script>
  <script src="design-specs.js"></script>
</body>
</html>
