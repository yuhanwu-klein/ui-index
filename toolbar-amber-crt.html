<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRT Toolbar · Serene</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('is-preview')</script>
  <style>
    *{box-sizing:border-box;margin:0}
    :root{
      --bg:#060a14;--panel:#0a1020;--fg:#4a9eff;--dim:#1e4a7a;--glow:#6ac0ff;
      --bright:#9ad4ff;--border:#12203a;
      --px:'Press Start 2P',monospace;--mono:'Share Tech Mono',monospace;
    }
    html,body{height:100%;background:#fff;font-family:var(--mono)}
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    .fui{
      width:560px;max-width:85vw;aspect-ratio:4/3;
      display:grid;grid-template-rows:34px 1fr 24px;grid-template-columns:36px 1fr 36px;
      gap:1px;background:var(--border);color:var(--fg);
      border-radius:8px;overflow:hidden;position:relative;
      box-shadow:0 16px 48px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);
    }
    .fui::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.3) 2px,rgba(0,0,0,.3) 4px);pointer-events:none;opacity:.08;z-index:100;border-radius:8px}
    .fui::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.35));pointer-events:none;z-index:101;border-radius:8px}

    .tb{background:var(--panel);display:flex;align-items:center}
    .tb-top{grid-column:1/-1;gap:2px;padding:0 6px;justify-content:space-between}
    .tb-v{flex-direction:column;padding:4px 0;gap:1px}
    .tb-bot{grid-column:1/-1;gap:6px;padding:0 8px}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
      height:24px;min-width:24px;padding:0 8px;
      background:0;border:1px solid transparent;
      color:var(--fg);font:10px var(--mono);cursor:pointer;
      letter-spacing:.05em;text-transform:uppercase;
      transition:background .12s,border-color .12s,color .12s,text-shadow .12s;
      user-select:none;
    }
    .btn:hover{background:rgba(74,158,255,.08);border-color:var(--dim);color:var(--glow);text-shadow:0 0 8px rgba(74,158,255,.4)}
    .btn:active,.btn.on{background:rgba(74,158,255,.14);border-color:var(--fg);color:var(--bright);text-shadow:0 0 12px rgba(74,158,255,.5)}
    .tb-v .btn{height:28px;width:28px;padding:0}
    .btn-z{height:18px;min-width:18px;padding:0 3px;font:10px var(--mono)}

    .sep{background:var(--border);flex-shrink:0}
    .tb-top .sep,.tb-bot .sep{width:1px;height:14px;margin:0 2px}
    .tb-v .sep{height:1px;width:18px;margin:2px 0}
    .g{display:flex;align-items:center;gap:1px}
    .tb-v .g{flex-direction:column}

    svg.i{width:13px;height:13px;fill:currentColor}

    .st{font:6px var(--px);color:var(--dim);letter-spacing:.08em;white-space:nowrap}
    .st b{color:var(--fg);font-weight:400}

    .vp{background:var(--bg);position:relative;overflow:hidden}

    .vp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:url(#crt-face);z-index:0}
    .vp-glow{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:grayscale(1) brightness(.12) contrast(1.4) sepia(1) hue-rotate(190deg) saturate(4) blur(16px);opacity:.45;pointer-events:none;z-index:0}
    .hud{position:absolute;inset:0;z-index:2;pointer-events:none}
    .hud-panel{position:absolute;padding:6px 8px}
    .hud-tl{top:0;left:0}
    .hud-tr{top:0;right:0;text-align:right}
    .hud-bl{bottom:0;left:0}
    .hud-br{bottom:0;right:0;text-align:right}
    .hud-title{font:6px var(--px);color:var(--fg);letter-spacing:.1em}
    .hud-tag{display:inline-block;font:5px var(--px);color:var(--glow);letter-spacing:.08em;border:1px solid var(--dim);padding:1px 4px;margin-left:4px}
    .hud-data{font:5px var(--px);color:var(--dim);letter-spacing:.06em;line-height:1.9}
    .hud-data b{color:var(--fg);font-weight:400}
    .hud-val{font:18px var(--mono);color:var(--glow);text-shadow:0 0 10px rgba(74,158,255,.35)}
    .hud-unit{font:5px var(--px);color:var(--dim);letter-spacing:.08em;margin-left:2px}

    .scan-v{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--fg),transparent);opacity:.25;z-index:3;animation:scanh 4s ease-in-out infinite}
    @keyframes scanh{0%,100%{left:5%}50%{left:95%}}
    @keyframes pulse{0%,100%{opacity:.8}50%{opacity:.15}}

    html.is-preview .fui::before,html.is-preview .fui::after{display:none}
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="crt-face" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5" result="smooth"/>
      <feColorMatrix type="saturate" values="0" in="smooth" result="gray"/>
      <feComponentTransfer in="gray" result="hi">
        <feFuncR type="linear" slope="4.5" intercept="-1.3"/>
        <feFuncG type="linear" slope="4.5" intercept="-1.3"/>
        <feFuncB type="linear" slope="4.5" intercept="-1.3"/>
      </feComponentTransfer>
      <feColorMatrix type="matrix" in="hi" values="
        0.12 0 0 0 0.01
        0.28 0 0 0 0.02
        0.7  0 0 0 0.04
        0    0 0 1 0
      "/>
    </filter>
  </defs>
</svg>

<div class="fui">
  <nav class="tb tb-top">
    <div class="g">
      <button class="btn" aria-label="Menu"><svg class="i" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="10" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>
      <div class="sep"></div>
      <button class="btn"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="2"/><rect x="2" y="2" width="2" height="12"/><rect x="2" y="12" width="12" height="2"/><rect x="12" y="2" width="2" height="12"/><rect x="5" y="5" width="2" height="6"/><rect x="5" y="5" width="6" height="2"/></svg> New</button>
      <button class="btn"><svg class="i" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="2"/><rect x="3" y="1" width="2" height="6"/><rect x="3" y="5" width="4" height="2"/><rect x="5" y="7" width="2" height="2"/><rect x="7" y="7" width="2" height="8"/><rect x="3" y="13" width="10" height="2"/><rect x="11" y="7" width="2" height="8"/></svg> Save</button>
    </div>
    <div class="g">
      <button class="btn" data-group="mode">Select</button>
      <button class="btn on" data-group="mode">Scan</button>
      <button class="btn" data-group="mode">Analyze</button>
    </div>
    <div class="g">
      <button class="btn" aria-label="Search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="11" y="11" width="4" height="2" transform="rotate(-45 11 11)"/></svg></button>
      <button class="btn" data-toggle aria-label="Settings"><svg class="i" viewBox="0 0 16 16"><rect x="5" y="5" width="6" height="6"/><rect x="7" y="1" width="2" height="4"/><rect x="7" y="11" width="2" height="4"/><rect x="1" y="7" width="4" height="2"/><rect x="11" y="7" width="4" height="2"/></svg></button>
    </div>
  </nav>

  <aside class="tb tb-v">
    <div class="g">
      <button class="btn on" data-group="tool" data-tool="Cursor" aria-label="Cursor"><svg class="i" viewBox="0 0 16 16"><polygon points="3,1 3,12 6,9 10,14 12,13 8,8 12,8"/></svg></button>
      <button class="btn" data-group="tool" data-tool="Crosshair" aria-label="Crosshair"><svg class="i" viewBox="0 0 16 16"><rect x="7" y="1" width="2" height="14"/><rect x="1" y="7" width="14" height="2"/><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="btn" data-group="tool" data-tool="Pen" aria-label="Pen"><svg class="i" viewBox="0 0 16 16"><rect x="9" y="1" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(45 12 4)"/><rect x="3" y="11" width="5" height="3"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="g">
      <button class="btn" data-group="tool" data-tool="Grid" aria-label="Grid"><svg class="i" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button>
      <button class="btn" data-group="tool" data-tool="Layers" aria-label="Layers"><svg class="i" viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="6" width="10" height="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="11" width="10" height="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </aside>

  <main class="vp" id="vp">
    <img class="vp-glow" src="face.jpg" alt="" aria-hidden="true">
    <img class="vp-img" src="face.jpg" alt="Subject scan">
    <div class="scan-v"></div>

    <div class="hud">
      <svg viewBox="0 0 400 300" preserveAspectRatio="none" style="width:100%;height:100%">
        <!-- Face wireframe mesh -->
        <g stroke="var(--fg)" stroke-width=".35" fill="none" opacity=".18">
          <path d="M200,78 L158,100 L142,132 L148,162 L162,188 L182,204 L200,210 L218,204 L238,188 L252,162 L258,132 L242,100 Z"/>
          <line x1="158" y1="100" x2="242" y2="100"/>
          <line x1="142" y1="132" x2="258" y2="132"/>
          <line x1="148" y1="162" x2="252" y2="162"/>
          <line x1="162" y1="188" x2="238" y2="188"/>
          <line x1="200" y1="78" x2="200" y2="210"/>
          <line x1="200" y1="78" x2="158" y2="100"/><line x1="200" y1="78" x2="242" y2="100"/>
          <line x1="158" y1="100" x2="200" y2="132"/><line x1="242" y1="100" x2="200" y2="132"/>
          <line x1="142" y1="132" x2="200" y2="162"/><line x1="258" y1="132" x2="200" y2="162"/>
          <line x1="148" y1="162" x2="200" y2="188"/><line x1="252" y1="162" x2="200" y2="188"/>
          <line x1="162" y1="188" x2="200" y2="210"/><line x1="238" y1="188" x2="200" y2="210"/>
          <line x1="158" y1="100" x2="142" y2="132"/><line x1="242" y1="100" x2="258" y2="132"/>
          <line x1="142" y1="132" x2="148" y2="162"/><line x1="258" y1="132" x2="252" y2="162"/>
          <line x1="148" y1="162" x2="162" y2="188"/><line x1="252" y1="162" x2="238" y2="188"/>
        </g>

        <!-- Face bounding box -->
        <rect x="125" y="55" width="150" height="175" fill="none" stroke="var(--fg)" stroke-width=".5" opacity=".2" stroke-dasharray="4 3"/>
        <path d="M125,70 L125,55 L140,55" fill="none" stroke="var(--fg)" stroke-width="1" opacity=".5"/>
        <path d="M260,55 L275,55 L275,70" fill="none" stroke="var(--fg)" stroke-width="1" opacity=".5"/>
        <path d="M125,215 L125,230 L140,230" fill="none" stroke="var(--fg)" stroke-width="1" opacity=".5"/>
        <path d="M260,230 L275,230 L275,215" fill="none" stroke="var(--fg)" stroke-width="1" opacity=".5"/>

        <!-- Crosshair center -->
        <line x1="200" y1="135" x2="200" y2="143" stroke="var(--fg)" stroke-width=".4" opacity=".3"/>
        <line x1="200" y1="157" x2="200" y2="165" stroke="var(--fg)" stroke-width=".4" opacity=".3"/>
        <line x1="190" y1="150" x2="196" y2="150" stroke="var(--fg)" stroke-width=".4" opacity=".3"/>
        <line x1="204" y1="150" x2="210" y2="150" stroke="var(--fg)" stroke-width=".4" opacity=".3"/>

        <!-- Tracking points -->
        <circle cx="178" cy="118" r="2.5" fill="none" stroke="var(--glow)" stroke-width=".7" style="animation:pulse 2s ease infinite"/>
        <circle cx="222" cy="118" r="2.5" fill="none" stroke="var(--glow)" stroke-width=".7" style="animation:pulse 2s ease infinite .3s"/>
        <circle cx="200" cy="145" r="2" fill="none" stroke="var(--glow)" stroke-width=".6" style="animation:pulse 2.5s ease infinite .6s"/>
        <circle cx="200" cy="170" r="2" fill="none" stroke="var(--glow)" stroke-width=".6" style="animation:pulse 3s ease infinite .9s"/>
        <circle cx="152" cy="130" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.2s ease infinite 1.2s"/>
        <circle cx="248" cy="130" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.8s ease infinite .4s"/>
        <circle cx="200" cy="92" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2s ease infinite .7s"/>
        <circle cx="200" cy="200" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.4s ease infinite 1s"/>
        <circle cx="165" cy="160" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.6s ease infinite .2s"/>
        <circle cx="235" cy="160" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.3s ease infinite .8s"/>
        <circle cx="188" cy="168" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.1s ease infinite 1.1s"/>
        <circle cx="212" cy="168" r="1.5" fill="none" stroke="var(--glow)" stroke-width=".5" style="animation:pulse 2.7s ease infinite .5s"/>

        <!-- Tracking lines -->
        <line x1="178" y1="118" x2="152" y2="118" stroke="var(--dim)" stroke-width=".25" opacity=".3"/>
        <line x1="222" y1="118" x2="248" y2="118" stroke="var(--dim)" stroke-width=".25" opacity=".3"/>

        <!-- ECG trace -->
        <path d="M20,272 L38,272 L40,268 L43,272 L52,272 L53,273 L54,259 L55,280 L56,272 L68,272 L70,268 L75,272 L90,272 L92,268 L95,272 L104,272 L105,273 L106,259 L107,280 L108,272 L120,272 L122,268 L127,272 L138,272" fill="none" stroke="var(--fg)" stroke-width=".8" style="filter:drop-shadow(0 0 3px rgba(74,158,255,.25))"/>
      </svg>
    </div>

    <!-- Data panels -->
    <div class="hud-panel hud-tl">
      <div class="hud-title">BIO_PROFILE<span class="hud-tag">ACTIVE</span></div>
      <div class="hud-data" style="margin-top:3px">
        FILE:<b> #0003/0222</b><br>
        CLASS:<b> HOMO SAPIENS</b><br>
        SCAN:<b> DEEP TISSUE</b>
      </div>
    </div>
    <div class="hud-panel hud-tr">
      <div style="display:flex;align-items:baseline;gap:3px;justify-content:flex-end">
        <span class="hud-val" id="bpm">75</span>
        <span class="hud-unit">BPM</span>
      </div>
      <div class="hud-data" style="margin-top:2px">
        MODE:<b> ECG</b> &nbsp; LEAD:<b> II</b>
      </div>
    </div>
    <div class="hud-panel hud-bl">
      <div class="hud-data">
        SECTOR:<b> 0/45787</b><br>
        TEMP:<b> 97.2°F</b>
      </div>
    </div>
    <div class="hud-panel hud-br">
      <div class="hud-data">
        MATCH:<b> 98.7%</b><br>
        STATUS:<b> N.ACTION</b>
      </div>
    </div>
  </main>

  <aside class="tb tb-v">
    <div class="g">
      <button class="btn" data-toggle aria-label="Info"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="7" y="7" width="2" height="4"/><circle cx="8" cy="5" r="1"/></svg></button>
      <button class="btn" data-toggle aria-label="Lock"><svg class="i" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="8"/><rect x="5" y="3" width="6" height="6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="10" width="2" height="3"/></svg></button>
      <button class="btn" data-toggle aria-label="Fullscreen"><svg class="i" viewBox="0 0 16 16"><rect x="1" y="1" width="5" height="1.5"/><rect x="1" y="1" width="1.5" height="5"/><rect x="10" y="1" width="5" height="1.5"/><rect x="13.5" y="1" width="1.5" height="5"/><rect x="1" y="13.5" width="5" height="1.5"/><rect x="1" y="10" width="1.5" height="5"/><rect x="10" y="13.5" width="5" height="1.5"/><rect x="13.5" y="10" width="1.5" height="5"/></svg></button>
    </div>
  </aside>

  <nav class="tb tb-bot">
    <span class="st" id="status">Scan</span>
    <div class="sep"></div>
    <span class="st">X:<b id="cx">0000</b> Y:<b id="cy">0000</b></span>
    <div class="sep"></div>
    <button class="btn btn-z" id="zoom-out" aria-label="Zoom out">&minus;</button>
    <span class="st"><b id="zoom">100%</b></span>
    <button class="btn btn-z" id="zoom-in" aria-label="Zoom in">+</button>
    <span style="flex:1"></span>
    <span class="st" id="clk">--:--:--</span>
  </nav>
</div>

<script>
(function(){
  var cursors={Cursor:'default',Crosshair:'crosshair',Pen:'crosshair',Grid:'cell',Layers:'pointer'};
  var vp=document.getElementById('vp');

  document.querySelectorAll('.btn[data-group]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var g=btn.dataset.group;
      document.querySelectorAll('.btn[data-group="'+g+'"]').forEach(function(b){b.classList.remove('on')});
      btn.classList.add('on');
      var label=btn.dataset.tool||btn.textContent.trim();
      document.getElementById('status').textContent=label;
      if(g==='tool'&&cursors[label])vp.style.cursor=cursors[label];
    });
  });

  document.querySelectorAll('.btn[data-toggle]').forEach(function(btn){
    btn.addEventListener('click',function(){btn.classList.toggle('on')});
  });

  var zl=100,ze=document.getElementById('zoom');
  document.getElementById('zoom-in').addEventListener('click',function(){zl=Math.min(400,zl+25);ze.textContent=zl+'%'});
  document.getElementById('zoom-out').addEventListener('click',function(){zl=Math.max(25,zl-25);ze.textContent=zl+'%'});

  vp.addEventListener('mousemove',function(e){
    var r=vp.getBoundingClientRect();
    document.getElementById('cx').textContent=String(Math.round((e.clientX-r.left)/r.width*999)).padStart(4,'0');
    document.getElementById('cy').textContent=String(Math.round((e.clientY-r.top)/r.height*999)).padStart(4,'0');
  });

  setInterval(function(){var d=new Date();document.getElementById('clk').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return String(n).padStart(2,'0')}).join(':')},1000);

  var bpmEl=document.getElementById('bpm');
  if(bpmEl)setInterval(function(){bpmEl.textContent=72+Math.floor(Math.random()*7)},1200);
})();
</script>
<script src="design-specs.js"></script>
</body>
</html>
