<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    :root{
      --font:"Space Mono","SF Mono","Courier New",monospace;
      --pixel:"VT323","Space Mono",monospace;
      --pink:#ff5aa0;
      --green:#2eb86a;
      --yellow:#ffe340;
      --blue:#2d5bff;
      --ink:#000;
      --cream:#f3eac4;
      --ease:cubic-bezier(.22,1,.32,1);
    }
    html,body{width:100%;height:100%;margin:0;overflow:hidden;}
    body{
      display:grid;place-items:center;font-family:var(--font);color:var(--ink);
      background:conic-gradient(var(--pink) 25%, var(--green) 0 50%, var(--pink) 0 75%, var(--green) 0);
      background-size:8px 8px;image-rendering:pixelated;
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px, transparent 1px 3px);mix-blend-mode:multiply;}

    .stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:38px 24px;position:relative;z-index:1;width:min(96vw,460px);}
    .eyebrow{font-family:var(--pixel);font-size:22px;letter-spacing:.22em;color:var(--ink);text-transform:uppercase;background:var(--cream);padding:3px 12px 1px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);}
    .title{font-family:var(--pixel);font-size:40px;line-height:1;letter-spacing:.02em;color:var(--ink);text-transform:uppercase;text-align:center;background:var(--cream);padding:6px 16px 2px;border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);}

    .list{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:4px;}
    .opt{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--cream);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);cursor:pointer;overflow:hidden;
      transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .25s var(--ease);}
    .opt:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);}
    .opt:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink);}
    .opt[aria-checked="true"]{background:var(--yellow);}
    .opt.flash{animation:rgbSplit .36s steps(4) 1;}
    @keyframes rgbSplit{
      0%  {text-shadow:0 0 0 var(--ink);transform:translate(0,0);}
      25% {text-shadow:-3px 0 0 #0ff, 3px 0 0 #f0f;transform:translate(2px,-1px);}
      50% {text-shadow:3px 0 0 #0ff, -3px 0 0 #f0f;transform:translate(-2px,1px);}
      75% {text-shadow:-2px 0 0 #0ff, 2px 0 0 #f0f;transform:translate(1px,0);}
      100%{text-shadow:0 0 0 var(--ink);transform:translate(0,0);}
    }
    /* scanline sweep when selected */
    .opt[aria-checked="true"]::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg, transparent 0, rgba(255,255,255,.75) 50%, transparent 100%);
      transform:translateX(-100%);animation:sweep .55s steps(10) 1;}
    @keyframes sweep{to{transform:translateX(100%);}}

    /* chunky pixel radio */
    .rd{position:relative;flex:0 0 auto;width:28px;height:28px;border:2.5px solid var(--ink);background:var(--cream);overflow:hidden;border-radius:50%;}
    .rd .fill{position:absolute;inset:3px;border-radius:50%;background:
      conic-gradient(var(--ink) 25%, var(--blue) 0 50%, var(--ink) 0 75%, var(--blue) 0);
      background-size:4px 4px;transform:scale(0);transform-origin:center;transition:transform .32s steps(4);}
    .rd .dot{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .18s var(--ease) .22s, transform .3s cubic-bezier(.34,1.56,.64,1) .22s;transform:scale(.3);}
    .rd .dot::after{content:"";width:8px;height:8px;background:var(--yellow);border:1.5px solid var(--ink);box-shadow:1.5px 1.5px 0 var(--ink);}
    .opt[aria-checked="true"] .rd .fill{transform:scale(1);}
    .opt[aria-checked="true"] .rd .dot{opacity:1;transform:scale(1);}

    .copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
    .label{font-family:var(--pixel);font-size:26px;line-height:1;letter-spacing:.04em;color:var(--ink);text-transform:uppercase;}
    .meta{font-family:var(--pixel);font-size:14px;letter-spacing:.18em;color:var(--ink);text-transform:uppercase;opacity:.65;}

    .pill{flex:0 0 auto;padding:3px 8px 1px;font-family:var(--pixel);font-size:14px;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;background:var(--green);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);}

    .foot{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;}
    .label-small{font-family:var(--pixel);font-size:22px;letter-spacing:.14em;color:var(--ink);text-transform:uppercase;background:var(--cream);padding:3px 10px 1px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);}
    .launch{font-family:var(--pixel);font-size:22px;letter-spacing:.14em;color:var(--ink);text-transform:uppercase;background:var(--pink);padding:5px 14px 3px;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease);}
    .launch.ready{background:var(--yellow);animation:beat 1.1s steps(2) infinite;}
    @keyframes beat{0%,70%,100%{transform:translate(0,0);}35%{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}}
    .launch:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);animation:none;}
  </style>
</head>
<body>
  <main class="stage">
    <span class="eyebrow">Select.sys</span>
    <span class="title">Pick a Mode</span>

    <section class="list" id="list" role="radiogroup" aria-label="Difficulty"></section>

    <div class="foot">
      <span class="label-small" id="status">&gt; AWAITING_INPUT</span>
      <button class="launch" id="launch" type="button">Launch &gt;&gt;</button>
    </div>
  </main>

  <script>
    const options = [
      { id:'easy',   t:'Easy_mode',      m:'>> for N00BS',  pill:'.NEW' },
      { id:'norm',   t:'Normal_mode',    m:'>> balanced',   pill:'.STD' },
      { id:'hard',   t:'Hard_mode',      m:'>> GL;HF',      pill:'.PRO' },
      { id:'night',  t:'Nightmare',      m:'>> good_luck',  pill:'.MAX' },
    ];
    const list = document.getElementById('list');
    const statusEl = document.getElementById('status');
    const launchBtn = document.getElementById('launch');
    list.innerHTML = options.map(o => `
      <div class="opt" data-id="${o.id}" role="radio" aria-checked="false" tabindex="0">
        <span class="rd" aria-hidden="true"><span class="fill"></span><span class="dot"></span></span>
        <span class="copy">
          <span class="label">${o.t}</span>
          <span class="meta">${o.m}</span>
        </span>
        <span class="pill">${o.pill}</span>
      </div>`).join('');

    function pick(opt) {
      list.querySelectorAll('.opt').forEach(o => {
        const on = (o === opt);
        o.setAttribute('aria-checked', String(on));
        if (on) {
          o.classList.remove('flash'); void o.offsetWidth; o.classList.add('flash');
          /* re-trigger the scanline sweep ::after animation */
          o.style.animationName = ''; /* no-op to appease linters */
        }
      });
      const data = options.find(x => x.id === opt.dataset.id);
      statusEl.textContent = `> MODE: ${data.t.toUpperCase()}`;
      launchBtn.classList.add('ready');
    }

    list.addEventListener('click', (e) => {
      const opt = e.target.closest('.opt');
      if (!opt || opt.getAttribute('aria-checked') === 'true') return;
      pick(opt);
    });
    list.addEventListener('keydown', (e) => {
      const opts = [...list.querySelectorAll('.opt')];
      const idx = opts.findIndex(o => o === document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const next = (idx + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
        opts[next].focus(); pick(opts[next]);
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (idx >= 0) { e.preventDefault(); pick(opts[idx]); }
      }
    });

    if (new URLSearchParams(location.search).has('preview')) {
      const order = ['norm','hard','night','easy'];
      let i = 0;
      window.setInterval(() => {
        pick(list.querySelector(`.opt[data-id="${order[i % order.length]}"]`));
        i += 1;
      }, 1800);
    }
  </script>
</body>
</html>
