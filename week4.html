<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 4 · UI Index</title>
  <style>
    * { box-sizing:border-box; }
    :root { --page:#fff; --ink:#1a1a18; --muted:#7c7c77; --line:#e6e6e2; --font:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"SF Mono","Courier New",monospace; }
    html,body { min-height:100%; margin:0; color:var(--ink); font-family:var(--font); }
    body { padding:28px; background:var(--page); }
    main { width:min(100%,1440px); margin:0 auto; min-height:calc(100vh - 56px); display:grid; grid-template-rows:60px 1fr 40px; gap:20px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:4px 2px; }
    .header-main { display:flex; align-items:center; gap:14px; min-width:0; }
    .back { min-height:40px; display:inline-flex; align-items:center; padding:0 14px; border:1px solid var(--line); border-radius:999px; color:var(--ink); background:#fff; font:650 12px/1 var(--font); text-decoration:none; white-space:nowrap; }
    .back:hover { border-color:#a9a9a4; }
    .back:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em; }
    h1 a { color:inherit; text-decoration:none; }
    .count { color:var(--muted); font:600 11px/1 var(--mono); letter-spacing:.14em; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; align-content:start; }
    .slot { min-width:0; aspect-ratio:1/1; border:1.5px dashed var(--line); border-radius:22px; background:#fff; }
    .foot { display:flex; align-items:center; gap:6px; color:var(--muted); font:600 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:4px 2px; }
    .foot .d { width:6px; height:6px; border-radius:2px; background:var(--ink); opacity:.65; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } }
    @media (max-width:560px) { body { padding:16px; } main { min-height:calc(100vh - 32px); grid-template-rows:48px auto 32px; gap:12px; } .grid { grid-template-columns:1fr; gap:12px; } }
  </style>
</head>
<body>
  <main>
    <header><div class="header-main"><a class="back" href="index.html">← Archive</a><h1>Week 4</h1></div><span class="count">00 / 06</span></header>
    <section class="grid" aria-label="Week 4 project placeholders">
      <article class="slot" aria-label="Empty project slot 1"></article>
      <article class="slot" aria-label="Empty project slot 2"></article>
      <article class="slot" aria-label="Empty project slot 3"></article>
      <article class="slot" aria-label="Empty project slot 4"></article>
      <article class="slot" aria-label="Empty project slot 5"></article>
      <article class="slot" aria-label="Empty project slot 6"></article>
    </section>
    <div class="foot"><span class="d"></span>Built with care</div>
  </main>
</body>
</html>
